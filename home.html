<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/layout.css" rel="stylesheet">

    <style>
        .favorite-card {
            transition: 0.2s;
            border-radius: 16px;
        }

        .favorite-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .reminder {
            border-left: 5px solid #0d6efd;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .reminder.today {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .memo {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 8px 4px;
            border-bottom: 1px solid #f1f1f1;
        }

        .memo.done .memo-title {
            text-decoration: line-through;
            color: #999;
        }

        .memo .memo-actions {
            margin-left: auto;
            white-space: nowrap;
        }

        .money {
            font-size: 1.3rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1" id="greeting">歡迎回來</h2>
                            <p class="text-muted mb-0" id="todayText"></p>
                        </div>
                        <a href="page/calendar.html" id="btnOpenCalendar" class="btn btn-outline-primary btn-sm">📅 開啟行事曆</a>
                    </div>
                </div>

                <!-- 系統通知：新帳號待審核（系統管理員） -->
                <div id="approvalBanner" class="alert alert-warning d-none mb-3">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span class="fs-5">🔔</span>
                        <span class="me-auto">有 <b id="approvalCount">0</b> 個新帳號等待審核：<span id="approvalNames"></span></span>
                        <a href="page/access.html#pending" class="btn btn-sm btn-warning">前往審核</a>
                    </div>
                </div>

                <div class="row g-3 mb-3">

                    <!-- 行事曆提醒 -->
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white d-flex justify-content-between">
                                <span>🔔 行事曆提醒（今天起 14 天）</span>
                                <span id="reminderCount" class="badge bg-primary"></span>
                            </div>
                            <div class="card-body" id="reminderList">
                                <div class="text-muted small">載入中…</div>
                            </div>
                        </div>
                    </div>

                    <!-- 備忘錄 -->
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <span>📝 備忘錄</span>
                                <div class="form-check form-switch mb-0 small">
                                    <input class="form-check-input" type="checkbox" id="memoShowDone">
                                    <label class="form-check-label" for="memoShowDone">顯示已完成</label>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="input-group input-group-sm mb-1">
                                    <input id="memoTitle" class="form-control" placeholder="新增備忘，例如：週五前叫貨鮮乳">
                                    <input id="memoDue" type="date" class="form-control" style="max-width:150px" title="到期日（選填）">
                                    <button id="btnMemoAdd" class="btn btn-primary">新增</button>
                                </div>
                                <div class="d-flex gap-3 small mb-2">
                                    <select id="memoPriority" class="form-select form-select-sm" style="width:auto">
                                        <option value="中">一般</option>
                                        <option value="高">重要</option>
                                        <option value="低">不急</option>
                                    </select>
                                    <div class="form-check mt-1">
                                        <input class="form-check-input" type="checkbox" id="memoShared">
                                        <label class="form-check-label" for="memoShared">共享給同事</label>
                                    </div>
                                </div>
                                <div id="memoList"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 財務（有權限才顯示） -->
                <div class="row g-3 mb-3 d-none" id="financeRow">
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white">💰 待收款提醒</div>
                            <div class="card-body" id="arList"></div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white">📈 本月收支</div>
                            <div class="card-body">
                                <div class="row text-center">
                                    <div class="col-4">
                                        <div class="small text-muted">收入</div>
                                        <div id="mIncome" class="money text-success">$0</div>
                                    </div>
                                    <div class="col-4">
                                        <div class="small text-muted">支出</div>
                                        <div id="mExpense" class="money text-danger">$0</div>
                                    </div>
                                    <div class="col-4">
                                        <div class="small text-muted">淨額</div>
                                        <div id="mNet" class="money">$0</div>
                                    </div>
                                </div>
                                <div id="mDetail" class="small text-muted mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        ⭐ 我的最愛功能
                    </div>
                    <div class="card-body">
                        <div id="fav-grid"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <div id="footerArea"></div>

    <script src="js/settings.js"></script>
    <script src="js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/favorite.js"></script>
    <script src="js/pages/home.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            App.init("Home");
        });
    </script>

</body>

</html>
