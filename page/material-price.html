<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜原物料漲幅表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .stat-card .value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .price-table td,
        .price-table th {
            white-space: nowrap;
            vertical-align: middle;
        }

        .price-table tr.clickable {
            cursor: pointer;
        }

        .up {
            color: #dc3545;
            font-weight: 600;
        }

        .down {
            color: #198754;
            font-weight: 600;
        }

        .chart-box svg {
            width: 100%;
            height: 240px;
        }

        .chart-box text {
            font-size: 11px;
            fill: #6b7280;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">📈 原物料漲幅表</h2>
                        <p class="text-muted mb-0">依「原物料進貨」的每次單價自動計算：最新價格、比上次、比 3 個月前、比 1 年前的漲跌幅與走勢。點選原料看完整價格歷史。</p>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">追蹤中原料</div><div id="sumTracked" class="value">0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">最近一次上漲</div><div id="sumUp" class="value up">0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">一年平均漲幅</div><div id="sumYearAvg" class="value">-</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">一年漲最多</div><div id="sumTop" class="value small">-</div>
                    </div></div></div>
                </div>

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="row g-2 mb-2">
                            <div class="col-6 col-md-3">
                                <input id="qKeyword" class="form-control form-control-sm" placeholder="搜尋原料 / 供應商">
                            </div>
                            <div class="col-6 col-md-3">
                                <select id="qCategory" class="form-select form-select-sm"></select>
                            </div>
                            <div class="col-6 col-md-3">
                                <select id="qSort" class="form-select form-select-sm">
                                    <option value="yearDesc">一年漲幅（高 → 低）</option>
                                    <option value="lastDesc">比上次漲幅（高 → 低）</option>
                                    <option value="date">最近進貨日</option>
                                    <option value="name">名稱</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-3 text-end">
                                <button id="btnCsv" class="btn btn-sm btn-outline-secondary">⬇ CSV</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm table-hover price-table mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>原料</th>
                                        <th class="text-end">最新單價</th>
                                        <th>最近進貨</th>
                                        <th class="text-end">上次單價</th>
                                        <th class="text-end">比上次</th>
                                        <th class="text-end">比 3 個月前</th>
                                        <th class="text-end">比 1 年前</th>
                                        <th class="text-end">最低</th>
                                        <th class="text-end">最高</th>
                                        <th class="text-end">次數</th>
                                        <th>走勢</th>
                                    </tr>
                                </thead>
                                <tbody id="priceBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 單一原料歷史 -->
                <div id="detailCard" class="card border-0 shadow-sm d-none">
                    <div class="card-body">
                        <h5 id="detailTitle" class="mb-2"></h5>
                        <div id="chartBox" class="chart-box mb-3"></div>
                        <div class="table-responsive">
                            <table class="table table-sm price-table mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>進貨日期</th>
                                        <th>供應商</th>
                                        <th class="text-end">數量</th>
                                        <th class="text-end">總價</th>
                                        <th class="text-end">單價</th>
                                        <th class="text-end">比上次</th>
                                        <th>批號</th>
                                    </tr>
                                </thead>
                                <tbody id="historyBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/stock-util.js"></script>
    <script src="../js/pages/material-price.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("MaterialPrice");
        });
    </script>

</body>

</html>
