<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜AI 文案發想</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .event-preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: .9rem;
            white-space: pre-wrap;
        }

        #output {
            min-height: 320px;
            font-size: .95rem;
            line-height: 1.6;
        }

        .draft-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            background: #fff;
        }

        .draft-card:hover,
        .draft-card.active {
            border-color: #d63384;
        }

        .btn-check+.btn {
            font-size: .85rem;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">✨ AI 文案發想</h2>
                        <p class="text-muted mb-0">輸入大綱或選擇行事曆活動，產生社群貼文、活動文案或日誌</p>
                    </div>
                </div>

                <div class="row g-3">

                    <!-- 設定 -->
                    <div class="col-lg-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">

                                <label class="form-label fw-bold">1. 素材來源</label>
                                <div class="btn-group w-100 mb-2" role="group">
                                    <input type="radio" class="btn-check" name="source" id="srcOutline" value="outline" checked>
                                    <label class="btn btn-outline-secondary" for="srcOutline">✍️ 自行輸入大綱</label>
                                    <input type="radio" class="btn-check" name="source" id="srcCalendar" value="calendar">
                                    <label class="btn btn-outline-secondary" for="srcCalendar">📅 選擇行事曆活動</label>
                                </div>

                                <div id="calendarBox" class="d-none mb-2">
                                    <select id="eventSelect" class="form-select mb-2"></select>
                                    <div id="eventPreview" class="event-preview d-none"></div>
                                    <div class="form-check mt-1">
                                        <input class="form-check-input" type="checkbox" id="useStall" checked>
                                        <label class="form-check-label small" for="useStall">日誌類文件附上出攤營業數據（對外貼文不會附）</label>
                                    </div>
                                </div>

                                <label class="form-label fw-bold mt-2">2. 文案類型</label>
                                <select id="draftType" class="form-select mb-2">
                                    <optgroup label="發文">
                                        <option value="活動預告貼文">活動預告貼文</option>
                                        <option value="活動當天即時動態">活動當天即時動態</option>
                                        <option value="活動結束感謝文">活動結束感謝文</option>
                                        <option value="新品介紹貼文">新品介紹貼文</option>
                                        <option value="一般品牌貼文">一般品牌貼文</option>
                                    </optgroup>
                                    <optgroup label="日誌 / 細節">
                                        <option value="出攤日誌">出攤日誌（工作紀錄與檢討）</option>
                                        <option value="活動細節整理">活動細節整理（給工作人員的行前須知）</option>
                                    </optgroup>
                                </select>

                                <div class="row g-2">
                                    <div class="col-6">
                                        <label class="form-label fw-bold">3. 平台</label>
                                        <select id="platform" class="form-select">
                                            <option>Instagram</option>
                                            <option>Facebook</option>
                                            <option>LINE 官方帳號</option>
                                            <option>Threads</option>
                                            <option>內部紀錄</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label fw-bold">語氣</label>
                                        <select id="tone" class="form-select">
                                            <option>活潑可愛</option>
                                            <option>溫暖療癒</option>
                                            <option>專業質感</option>
                                            <option>幽默有梗</option>
                                            <option>簡潔清楚</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label fw-bold">長度</label>
                                        <select id="length" class="form-select">
                                            <option value="約 80 字">短（約 80 字）</option>
                                            <option value="約 200 字" selected>中（約 200 字）</option>
                                            <option value="約 400 字">長（約 400 字）</option>
                                        </select>
                                    </div>
                                    <div class="col-6 small pt-4">
                                        <div class="form-check"><input class="form-check-input" type="checkbox" id="optHashtag" checked><label class="form-check-label" for="optHashtag">加入 hashtag</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" id="optEmoji" checked><label class="form-check-label" for="optEmoji">加入 emoji</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" id="optVersions"><label class="form-check-label" for="optVersions">給 3 個版本</label></div>
                                    </div>
                                </div>

                                <label class="form-label fw-bold mt-3">4. 大綱 / 補充說明</label>
                                <textarea id="outline" rows="5" class="form-control" placeholder="例如：這週六在華山市集，新口味芒果雪酪首賣，前 30 名送鯛魚燒…"></textarea>

                                <button id="btnGenerate" class="btn btn-primary w-100 mt-3">✨ 產生文案</button>
                                <div class="small text-muted mt-2">需要管理員在 Apps Script 設定 GEMINI_API_KEY 才能使用</div>
                            </div>
                        </div>
                    </div>

                    <!-- 結果 -->
                    <div class="col-lg-7">
                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-body">
                                <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                    <h5 class="mb-0 me-auto">📝 產生結果</h5>
                                    <button id="btnCopy" class="btn btn-sm btn-outline-secondary">複製</button>
                                    <button id="btnRegenerate" class="btn btn-sm btn-outline-primary">重新產生</button>
                                    <button id="btnSave" class="btn btn-sm btn-success">存到文案庫</button>
                                </div>
                                <input id="draftTitle" class="form-control mb-2" placeholder="文案標題（存檔用）">
                                <textarea id="output" class="form-control" placeholder="產生的文案會顯示在這裡，可以直接修改"></textarea>
                                <div id="status" class="small text-muted mt-2"></div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="mb-0">📚 我的文案庫</h5>
                                    <input id="qDraft" class="form-control form-control-sm" style="max-width:200px" placeholder="搜尋">
                                </div>
                                <div id="draftList"></div>
                                <div id="draftEmpty" class="text-muted small d-none">還沒有儲存的文案</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/ai-writer.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("AiWriter");
        });
    </script>

</body>

</html>
