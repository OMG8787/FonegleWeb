<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜郵件專區(未完成)</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#c48b6a">
    <script src="../js/theme.js?v=202610080006"></script>
    <link href="../css/dark.css?v=202610080006" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css?v=202610080006" rel="stylesheet">

    <style>

    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">郵件專區(未完成)</h2>
                        <p class="text-muted mb-0">
                            單筆發送
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="card shadow-sm">

                    <div class="card-header">
                        <h3 class="mb-0">寄送信件</h3>
                    </div>

                    <div class="card-body">

                        <!-- 主旨 -->
                        <div class="mb-3">
                            <label class="form-label">主旨</label>
                            <input type="text" id="MailSubject" class="form-control" placeholder="請輸入主旨">
                        </div>

                        <!-- 信件內容 -->
                        <div class="mb-3">
                            <label class="form-label">內容</label>
                            <textarea id="MailContent" class="form-control" rows="10" placeholder="請輸入信件內容"></textarea>
                        </div>

                        <!-- 附件 -->
                        <div class="mb-3">
                            <label class="form-label">附件</label>
                            <input type="file" id="AttachmentFile" class="form-control" multiple>
                        </div>

                        <!-- 新增收件人 -->
                        <div class="row g-2 mb-3">

                            <div class="col">
                                <input type="email" id="RecipientEmail" class="form-control" placeholder="請輸入收件人Email">
                            </div>

                            <div class="col-auto">
                                <button type="button" id="btnAddRecipient" class="btn btn-primary">
                                    新增
                                </button>
                            </div>
                        </div>

                        <!-- 收件人列表 -->
                        <div class="mb-3">

                            <div class="fw-bold mb-2">
                                收件人 (<span id="RecipientCount">0</span>)
                            </div>

                            <div id="RecipientContainer" class="d-flex flex-wrap gap-2">
                            </div>

                        </div>

                        <!-- 送出 -->
                        <button type="button" id="submitBtn" class="btn btn-success w-100">
                            寄送信件
                        </button>

                    </div>

                </div>


            </div>

        </div>
    </div>

    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js?v=202610080006"></script>
    <script src="../js/site.js?v=202610080006"></script>
    <script src="../js/auth.js?v=202610080006"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js?v=202610080006"></script>
    <script src="../js/api.js?v=202610080006"></script>
    <script src="../js/layout.js?v=202610080006"></script>
    <script src="../js/core.js?v=202610080006"></script>
    <script src="../js/ai-chat.js?v=202610080006"></script>
    <script src="../js/favorite.js?v=202610080006"></script>
    <script src="../js/pages/mail.js?v=202610080006"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("MailPage");
        });
    </script>

</body>

</html>
