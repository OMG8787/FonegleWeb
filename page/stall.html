<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜出攤紀錄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .stat-card .value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .stall-card {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            background: #fff;
            transition: .15s;
        }

        .stall-card:hover,
        .stall-card.active {
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, .12);
        }

        .profit {
            color: #198754;
        }

        .loss {
            color: #dc3545;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px;
        }

        .result-box .big {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .section-title {
            font-weight: bold;
            margin: 18px 0 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">🧾 出攤紀錄</h2>
                            <p class="text-muted mb-0">記錄每次出攤的費用、收款與盈虧</p>
                        </div>
                        <button id="btnNew" class="btn btn-success">＋ 新增出攤紀錄</button>
                    </div>
                </div>

                <!-- 統計 -->
                <div class="row g-2 mb-3">
                    <div class="col-6 col-lg">
                        <div class="card border-0 shadow-sm stat-card"><div class="card-body">
                            <div class="text-muted small">出攤次數</div>
                            <div id="sumCount" class="value">0</div>
                        </div></div>
                    </div>
                    <div class="col-6 col-lg">
                        <div class="card border-0 shadow-sm stat-card"><div class="card-body">
                            <div class="text-muted small">總營業額</div>
                            <div id="sumRevenue" class="value">$0</div>
                        </div></div>
                    </div>
                    <div class="col-6 col-lg">
                        <div class="card border-0 shadow-sm stat-card"><div class="card-body">
                            <div class="text-muted small">總成本</div>
                            <div id="sumCost" class="value">$0</div>
                        </div></div>
                    </div>
                    <div class="col-6 col-lg">
                        <div class="card border-0 shadow-sm stat-card"><div class="card-body">
                            <div class="text-muted small">總盈虧</div>
                            <div id="sumProfit" class="value">$0</div>
                        </div></div>
                    </div>
                    <div class="col-12 col-lg">
                        <div class="card border-0 shadow-sm stat-card"><div class="card-body">
                            <div class="text-muted small">平均每場盈虧</div>
                            <div id="sumAvgProfit" class="value">$0</div>
                        </div></div>
                    </div>
                </div>

                <div class="row g-3">

                    <!-- 列表 -->
                    <div class="col-lg-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="row g-2 mb-3">
                                    <div class="col-5">
                                        <input id="qMonth" type="month" class="form-control" title="月份">
                                    </div>
                                    <div class="col-7">
                                        <input id="qKeyword" class="form-control" placeholder="活動名稱 / 地點">
                                    </div>
                                    <div class="col-12 d-flex gap-2">
                                        <button id="btnSearch" class="btn btn-primary flex-fill">查詢</button>
                                        <button id="btnSearchAll" class="btn btn-outline-secondary">全部</button>
                                    </div>
                                </div>
                                <div id="stallList"></div>
                                <div id="emptyHint" class="text-muted d-none">查無出攤紀錄</div>
                            </div>
                        </div>
                    </div>

                    <!-- 表單 -->
                    <div class="col-lg-7">
                        <div id="formCard" class="card border-0 shadow-sm">
                            <div class="card-body">

                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 id="formTitle" class="mb-0">➕ 新增出攤紀錄</h5>
                                    <span id="editHint" class="badge bg-warning text-dark d-none">編輯中</span>
                                </div>

                                <form id="stallForm" onsubmit="return false">

                                    <input type="hidden" id="ID">

                                    <div class="section-title">📅 活動資訊</div>
                                    <div class="row g-2">
                                        <div class="col-12">
                                            <label class="form-label small">從行事曆選擇活動（選填，會自動帶入）</label>
                                            <select id="CalendarId" class="form-select"></select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label small">出攤日期 *</label>
                                            <input id="StallDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-md-8">
                                            <label class="form-label small">活動名稱 *</label>
                                            <input id="EventName" class="form-control">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small">地點</label>
                                            <input id="Location" class="form-control">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label small">主辦單位</label>
                                            <input id="Organizer" class="form-control">
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label small">人數</label>
                                            <input id="StaffCount" type="number" min="0" class="form-control calc">
                                        </div>
                                    </div>

                                    <div class="section-title">💸 費用</div>
                                    <div class="row g-2">
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">攤位費</label>
                                            <input id="BoothFee" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">車資</label>
                                            <input id="TransportCost" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">人手費用</label>
                                            <input id="StaffCost" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">其他費用</label>
                                            <input id="OtherCost" type="number" min="0" class="form-control calc">
                                        </div>
                                    </div>

                                    <div class="section-title d-flex justify-content-between align-items-center">
                                        <span>💰 收款</span>
                                        <button type="button" id="btnImportPOS" class="btn btn-sm btn-outline-primary">
                                            從現場點餐帶入當日收款
                                        </button>
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">現金收款</label>
                                            <input id="CashIncome" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">電子支付收款</label>
                                            <input id="ElectronicPay" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">手續費率 %</label>
                                            <input id="PaymentFeeRate" type="number" min="0" step="0.01" class="form-control calc" placeholder="例如 2.5">
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <label class="form-label small">手續費</label>
                                            <input id="PaymentFee" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <label class="form-label small">營業額（自動）</label>
                                            <input id="Revenue" type="number" class="form-control bg-light" readonly>
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <label class="form-label small">食材成本 %</label>
                                            <input id="FoodCostRate" type="number" min="0" max="100" step="0.1" class="form-control calc" placeholder="例如 35">
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label small">換算食材成本（自動）</label>
                                            <input id="FoodCost" type="number" class="form-control bg-light" readonly>
                                        </div>
                                    </div>

                                    <div class="section-title">🎯 營業目標</div>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label small">預計營業額低標</label>
                                            <input id="RevenueLow" type="number" min="0" class="form-control calc">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">營業額目標</label>
                                            <input id="RevenueTarget" type="number" min="0" class="form-control calc">
                                        </div>
                                    </div>

                                    <div class="section-title">📊 盈虧</div>
                                    <div class="result-box">
                                        <div class="row g-3 align-items-center">
                                            <div class="col-md-5 text-center">
                                                <div class="text-muted small">本次盈虧</div>
                                                <div id="resultProfit" class="big">$0</div>
                                                <div id="resultMargin" class="small text-muted">淨利率 0%</div>
                                            </div>
                                            <div class="col-md-7 small">
                                                <div class="d-flex justify-content-between"><span>總成本</span><b id="resultCost">$0</b></div>
                                                <div class="d-flex justify-content-between"><span>每人產值</span><b id="resultPerStaff">-</b></div>
                                                <div class="mt-2">低標達成 <b id="resultLowText">-</b></div>
                                                <div class="progress mb-2" style="height:8px"><div id="resultLowBar" class="progress-bar bg-info" style="width:0%"></div></div>
                                                <div>目標達成 <b id="resultTargetText">-</b></div>
                                                <div class="progress" style="height:8px"><div id="resultTargetBar" class="progress-bar bg-success" style="width:0%"></div></div>
                                            </div>
                                        </div>
                                        <div class="small text-muted mt-2">
                                            盈虧 = 營業額 − 攤位費 − 車資 − 人手費用 − 其他費用 − 手續費 − 食材成本
                                        </div>
                                    </div>

                                    <div class="section-title">📝 備註</div>
                                    <textarea id="Note" rows="3" class="form-control" placeholder="天氣、人潮、熱賣品項、檢討…"></textarea>

                                    <div class="d-flex flex-wrap gap-2 mt-3">
                                        <button id="btnCreate" class="btn btn-success">新增</button>
                                        <button id="btnUpdate" class="btn btn-primary">儲存修改</button>
                                        <button id="btnDelete" class="btn btn-outline-danger">刪除</button>
                                        <button id="btnClear" class="btn btn-outline-secondary ms-auto">清除 / 新增</button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/stall.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Stall");
        });
    </script>

</body>

</html>
