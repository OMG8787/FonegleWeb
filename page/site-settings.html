<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜公司與功能設定</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .logo-box { width: 120px; height: 80px; border: 1px dashed #ced4da; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; overflow: hidden; }
        .logo-box img { max-width: 100%; max-height: 100%; }
        .feat-group { border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; background: #fff; }
        .feat-group h6 { margin: 0 0 6px; }
        .feat-item { display: inline-flex; align-items: center; gap: 6px; margin: 2px 14px 2px 0; font-size: .92rem; }
        .feat-item.locked { color: #6c757d; }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">🏢 公司與功能設定</h2>
                        <p class="text-muted mb-0">設定公司資料與要開啟的功能。只有系統管理員看得到這一頁；存檔後全公司立即套用（其他人重新整理頁面即可）。</p>
                    </div>
                </div>

                <div class="row g-3">

                    <div class="col-lg-7">
                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-body">
                                <h5 class="mb-3">📇 公司資料</h5>
                                <div class="row g-2" id="companyForm"></div>
                                <div class="d-flex flex-wrap gap-2 mt-3">
                                    <button id="btnSaveCompany" class="btn btn-primary">💾 儲存公司資料</button>
                                    <button id="btnResetCompany" class="btn btn-outline-secondary">還原為系統預設</button>
                                    <button id="btnExportCompany" class="btn btn-outline-secondary" title="把目前畫面上的公司資料與功能開關下載成檔案，換系統或備份時用">⬇️ 匯出設定</button>
                                    <button id="btnImportCompany" class="btn btn-outline-secondary" title="從檔案填入畫面（不會立刻儲存，確認後再按儲存）">⬆️ 匯入設定</button>
                                    <input id="settingsFile" type="file" accept=".json,application/json" class="d-none">
                                </div>
                                <div class="small text-muted mt-2">
                                    這些資料會用在：左上角系統名稱與頁尾、登入頁、品牌資訊頁、製作報告（抬頭、頁尾、內建範本的聯絡資料）、寄信寄件人名稱與 AI 文案的品牌名稱。
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h5 class="mb-3">🖼️ Logo</h5>
                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <div class="logo-box"><img id="logoPreview" alt=""><span id="logoEmpty" class="small text-muted">未設定</span></div>
                                    <div>
                                        <input id="logoFile" type="file" accept="image/*" class="form-control form-control-sm mb-2">
                                        <button id="btnClearLogo" class="btn btn-sm btn-outline-secondary">移除 Logo</button>
                                    </div>
                                </div>
                                <div class="small text-muted mt-2">會顯示在左上角與登入頁，也是製作報告「用預設 Logo」的來源。圖片會自動縮小（約 200px），太大的圖請改用較小的檔案。</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h5 class="mb-1">🎛️ 功能開關</h5>
                                <div class="small text-muted mb-3">取消勾選＝關閉。關閉的功能不會出現在選單與我的最愛，一般使用者也無法開啟該頁；資料不會被刪除，系統管理員仍可直接進入。🔒 的功能不能關閉。</div>
                                <div id="featureList"></div>
                                <div class="feat-group">
                                    <h6>其他</h6>
                                    <label class="feat-item"><input type="checkbox" id="optAiChat"> 🤖 AI 助理（右下角聊天視窗）</label>
                                </div>
                                <button id="btnSaveFeatures" class="btn btn-primary">💾 儲存功能開關</button>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/site-settings.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("SiteSettings");
        });
    </script>

</body>

</html>
