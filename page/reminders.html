<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜提醒中心</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .rm-item {
            border: 1px solid #e5e7eb;
            border-left: 5px solid #94a3b8;
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
        }

        .rm-item.overdue { border-left-color: #dc3545; background: #fff5f5; }
        .rm-item.today { border-left-color: #fd7e14; background: #fff8f1; }
        .rm-item.soon { border-left-color: #0d6efd; }

        .rm-count { font-size: .8rem; }

        .rm-list { display: grid; gap: 8px; }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">🔔 提醒中心</h2>
                            <p class="text-muted mb-0">依每家客戶的開票與付款條件，自動列出要開發票、要收帳、要追回的保證金。處理完按一下就不再提醒。</p>
                        </div>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <input id="qCompany" class="form-control form-control-sm" style="width:220px" list="companyNames" placeholder="🔍 搜尋公司 / 客戶（預設全部）" autocomplete="off">
                            <datalist id="companyNames"></datalist>
                            <button id="btnClearSearch" type="button" class="btn btn-sm btn-outline-secondary d-none">清除</button>
                            <label class="small text-muted" for="qRange">顯示</label>
                            <select id="qRange" class="form-select form-select-sm" style="width:auto">
                                <option value="7">7 天內到期與逾期</option>
                                <option value="30">30 天內到期與逾期</option>
                                <option value="all">全部</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="searchNote" class="alert alert-info small d-none"></div>

                <div class="row g-3">

                    <div class="col-xl-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="mb-1">🧾 開發票 <span id="cntInvoice" class="badge bg-secondary rm-count">0</span></h5>
                                <div class="small text-muted mb-2">還沒收款、也還沒開發票的帳款（已收款的不提醒）</div>
                                <div id="sumInvoice" class="small fw-bold mb-2"></div>
                                <div id="bulkInvoice" class="d-none mb-2"></div>
                                <div id="listInvoice" class="rm-list"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="mb-1">💰 收帳 <span id="cntCollect" class="badge bg-secondary rm-count">0</span></h5>
                                <div class="small text-muted mb-2">還沒收齊的帳款，依到期日或客戶的付款條件計算</div>
                                <div id="sumCollect" class="small fw-bold mb-2"></div>
                                <div id="bulkCollect" class="d-none mb-2"></div>
                                <div id="listCollect" class="rm-list"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="mb-1">🔖 保證金 <span id="cntDeposit" class="badge bg-secondary rm-count">0</span></h5>
                                <div class="small text-muted mb-2">付出去還沒退回的保證金（<a href="deposit.html">保證金追蹤</a>）</div>
                                <div id="sumDeposit" class="small fw-bold mb-2"></div>
                                <div id="listDeposit" class="rm-list"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="small text-muted mt-3">
                    ⚙️ 每家客戶的開發票方式（每筆 / 月結 / 不開）、月結開票日、付款天數、固定匯款日，請到「客戶 / 合作廠商」的「開票與收款設定」修改。
                </div>

            </div>

        </div>

    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/billing.js"></script>
    <script src="../js/pages/reminders.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Reminders");
        });
    </script>

</body>

</html>
