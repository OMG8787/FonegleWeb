<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜OpenClaw管理區</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .list-group-item {
            border-radius: 12px !important;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .setting-header {
            cursor: pointer;
            padding: 12px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .setting-header:hover {
            background: #f8fafc;
        }

        .toggle-arrow {
            font-size: 18px;
            transition: 0.2s;
        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">OpenClawAgent專區</h2>
                        <p class="text-muted mb-0">
                            管理代理人相關資訊，權限功能請確認後再做開啟
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">

                        <h5 class="mb-3">Agent 管理中心</h5>

                        <!-- =========================
            1. 單一代理人權限設定
        ========================== -->
                        <div class="border rounded mb-3">

                            <div class="p-3 setting-header d-flex justify-content-between align-items-center"
                                onclick="Pages.AgentSetting.toggle(this, 'area_permission')">

                                <div>
                                    <div class="fw-bold">單一代理人權限設定</div>
                                    <small class="text-muted">需輸入使用者ID後才可操作</small>
                                </div>

                                <span class="toggle-arrow">▶</span>
                            </div>

                            <div id="area_permission" class="p-3 d-none">

                                <div class="input-group mb-3">
                                    <input id="agentUserId" class="form-control" placeholder="請輸入使用者ID">
                                    <button id="btnQueryAgent" class="btn btn-primary">查詢</button>
                                </div>

                                <div id="queryUserInfo" class="alert alert-success d-none mb-3">
                                    <div>
                                        <strong>成員名稱：</strong>
                                        <span id="queryUserName"></span>
                                    </div>

                                    <div>
                                        <strong>成員編號：</strong>
                                        <span id="queryUserNo"></span>
                                    </div>
                                </div>

                                <div id="permissionList" class="list-group"></div>

                                <button id="btnSubmitPermission" class="btn btn-success mt-3 w-100">
                                    更新權限設定
                                </button>

                            </div>
                        </div>

                        <!-- =========================
            2. 代理人帳號管理
        ========================== -->
                        <div class="border rounded mb-3">

                            <div class="p-3 setting-header d-flex justify-content-between align-items-center"
                                onclick="Pages.AgentSetting.toggle(this, 'area_agent')">


                                <div>
                                    <div class="fw-bold">代理人帳號管理</div>
                                    <small class="text-muted">可查詢、建立與修改代理人帳號資料</small>
                                </div>

                                <span class="toggle-arrow">▶</span>
                            </div>

                            <div id="area_agent" class="p-3 d-none">

                                <div class="row g-2 mb-3">

                                    <div class="col-md-3">
                                        <input id="searchAgentUserId" class="form-control" placeholder="使用者ID">
                                    </div>

                                    <div class="col-md-3">
                                        <input id="searchOpenClawAgentId" class="form-control"
                                            placeholder="OpenClawAgentId">
                                    </div>

                                    <div class="col-md-2">
                                        <select id="searchAgentStatus" class="form-select">

                                            <option value="">全部狀態</option>
                                            <option value="開啟">開啟</option>
                                            <option value="關閉">關閉</option>

                                        </select>
                                    </div>

                                    <div class="col-md-3">
                                        <input id="searchModelName" class="form-control" placeholder="ModelName 模糊查詢">
                                    </div>

                                    <div class="col-md-1">
                                        <button id="btnSearchAgent" class="btn btn-primary w-100">

                                            查詢

                                        </button>
                                    </div>

                                </div>

                                <div id="agentSearchResult" class="mt-3"></div>
                                <div class="table-responsive mt-3">

                                    <table class="table table-bordered table-hover">

                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>使用者ID</th>
                                                <th>使用者名稱</th>
                                                <th>Key</th>
                                                <th>總權限</th>
                                                <th>代理人名稱</th>
                                                <th>使用LLM模型</th>
                                                <th>是否啟用</th>
                                                <th>記憶功能</th>
                                                <th>最大記憶量</th>
                                                <th>保存天數</th>
                                                <th>聊天室ID</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>

                                        <tbody id="agentTableBody"></tbody>

                                    </table>

                                </div>
                                <div class="d-flex gap-2 mb-3">
                                    <button id="btnCreateAgent" class="btn btn-outline-success mb-3 w-100">
                                        ＋ 建立新的代理人
                                    </button>
                                    <button id="btnToggleAgentForm" class="btn btn-outline-secondary mb-3 w-100">
                                        展開代理人填寫區塊
                                    </button>
                                </div>
                                <div id="agentForm" class="d-none border rounded p-3 bg-light">

                                    <div class="mb-2">
                                        <label class="form-label">建立Agent的使用者ID（targetlineUserId）</label>
                                        <input id="targetlineUserId" class="form-control" placeholder="例如：ABC123DEF456">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">代理人代碼（AgentKey）</label>
                                        <input id="agentKey" class="form-control" placeholder="例如：customer_ai">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">代理人權限</label>
                                        <select id="agentToolsProfileName" class="form-select">
                                            <option value="">請選擇（預設）</option>
                                            <option value="full">full（最高權限）</option>
                                            <option value="messaging">messaging（安全）</option>
                                            <option value="minimal">minimal（限制）</option>
                                            <option value="coding">coding（自行建立）</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">OpenClaw 代理人 ID</label>
                                        <input id="openClawAgentId" class="form-control" placeholder="例如：AustinJr">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">工作目錄路徑（WorkspacePath）</label>
                                        <input id="workspacePath" class="form-control" placeholder="例如：C:\workspace">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">使用者 Profile 路徑（UserProfilePath）</label>
                                        <input id="userProfilePath" class="form-control"
                                            placeholder="例如：C:\Users\Admin">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">AI 模型（ModelName）</label>
                                        <input id="modelName" class="form-control" placeholder="例如：gemini-2.0-flash">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">Session 範圍（SessionScope）</label>
                                        <input id="sessionScope" class="form-control"
                                            placeholder="例如：global / per-user">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">Sandbox 模式（SandboxMode）</label>
                                        <input id="sandboxMode" class="form-control"
                                            placeholder="例如：strict / normal / off">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">Workspace 權限（WorkspaceAccess）</label>
                                        <input id="workspaceAccess" class="form-control"
                                            placeholder="readonly / write / full">
                                    </div>

                                    <div class="form-check form-switch mb-2">
                                        <input id="agentEnable" class="form-check-input" type="checkbox">
                                        <label class="form-check-label">是否啟用代理人</label>
                                    </div>

                                    <div class="form-check form-switch mb-3">
                                        <input id="allowMemory" class="form-check-input" type="checkbox" checked>
                                        <label class="form-check-label">是否允許 AI 記憶</label>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">最大記憶數量</label>
                                        <input id="maxMemoryCount" class="form-control" type="number" value="30">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">記憶保存天數</label>
                                        <input id="memoryExpireDays" class="form-control" type="number" value="30">
                                    </div>

                                    <button id="btnSaveAgent" class="btn btn-success w-100">
                                        儲存代理人資料
                                    </button>

                                </div>

                            </div>
                        </div>

                        <!-- =========================
                            3. 資料庫代理人總開關（工具總表）
                        ========================== -->
                        <div class="border rounded">

                            <div class="p-3 setting-header d-flex justify-content-between align-items-center"
                                onclick="Pages.AgentSetting.toggle(this, 'area_db')">

                                <div>
                                    <div class="fw-bold">代理人工具總開關</div>
                                    <small class="text-muted">工具總表管理（查詢 / 建立 / 更新）</small>
                                </div>

                                <span class="toggle-arrow">▶</span>
                            </div>

                            <div id="area_db" class="p-3 d-none">

                                <!-- 新增工具 -->
                                <button id="btnCreateTool" class="btn btn-outline-success w-100 mb-3">
                                    ＋ 建立新工具
                                </button>

                                <!-- 表單 -->
                                <div id="toolForm" class="d-none border rounded p-3 bg-light">

                                    <div class="mb-2">
                                        <label class="form-label">工具中文名稱</label>
                                        <input id="toolName" class="form-control" placeholder="例如：讀取檔案">
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label">官方工具名稱（AgentToolName）</label>
                                        <input id="agentToolName" class="form-control"
                                            placeholder="例如：read / exec / web_search">
                                    </div>

                                    <div class="form-check form-switch mb-3">
                                        <input id="toolEnable" class="form-check-input" type="checkbox" checked>
                                        <label class="form-check-label">是否啟用工具（預設啟用）</label>
                                    </div>

                                    <div class="alert alert-warning py-2">
                                        ⚠ 建立後將立即寫入工具總表，請確認名稱正確
                                    </div>

                                    <button id="btnSaveTool" class="btn btn-success w-100">
                                        建立工具
                                    </button>

                                </div>

                                <!-- 列表 -->
                                <div id="toolList" class="list-group mt-3"></div>

                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>
    <!-- 共用 layout -->
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>

    <script src="../js/pages/agent.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("AgentSetting");
        });
    </script>

</body>

</html>
