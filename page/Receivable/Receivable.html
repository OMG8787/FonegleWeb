<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜庫存管理(未開放)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .receivable-list-wrapper {
            max-height: calc(100vh - 330px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }

        .receivable-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fff;
            cursor: pointer;
            transition: .2s;
        }

        .receivable-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            transform: translateY(-2px);
        }

        .receivable-card.active {
            border: 2px solid #0d6efd;
            background: #eef6ff;
        }

        .empty-area {
            text-align: center;
            color: #94a3b8;
            padding: 60px 20px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .table th {
            background: #f8fafc;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        textarea.form-control {
            resize: vertical;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }

        .badge {
            font-size: .8rem;
        }

        #editHint {
            font-size: .85rem;
        }

        hr {
            margin: 1.5rem 0;
        }

        .card {
            border-radius: 16px;
        }

        input[readonly] {
            background: #f8f9fa;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cfd8dc;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #90a4ae;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        @media (max-width: 992px) {

            .receivable-list-wrapper {
                max-height: none;
            }

            .section-body {
                padding: 15px;
            }

            .search-area {
                padding: 12px;
            }

            .receivable-card {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">收帳管理(未開放)</h2>
                        <p class="text-muted mb-0">
                            盤點/出貨
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="row">

                    <!-- 左側：查詢 -->
                    <div class="col-lg-4">

                        <div class="card section-card shadow-sm mb-3">

                            <div class="section-header">
                                💰 收帳查詢
                            </div>

                            <div class="section-body">

                                <div class="search-area">

                                    <input id="qPayerName" class="form-control mb-2" placeholder="👤 付款人">

                                    <input id="qOrderID" class="form-control mb-2" placeholder="🧾 訂單編號">

                                    <input id="qTransactionNo" class="form-control mb-2" placeholder="💳 交易編號">

                                    <input id="qInvoiceNo" class="form-control mb-3" placeholder="🧾 發票號碼">

                                    <label class="form-label">
                                        💰 付款日期
                                    </label>

                                    <input id="qPaymentDate" type="date" class="form-control mb-3">

                                    <label class="form-label">
                                        💳 付款方式
                                    </label>

                                    <select id="qPaymentMethod" class="form-select mb-3">

                                        <option value="">全部付款方式</option>
                                        <option>現金</option>
                                        <option>轉帳</option>
                                        <option>LINE Pay</option>
                                        <option>信用卡</option>
                                        <option>月結</option>

                                    </select>

                                    <label class="form-label">
                                        📊 付款狀態
                                    </label>

                                    <select id="qPaymentStatus" class="form-select mb-3">

                                        <option value="">全部付款狀態</option>
                                        <option>未付款</option>
                                        <option>部分付款</option>
                                        <option>已付款</option>
                                        <option>退款</option>

                                    </select>

                                    <div class="form-check form-switch mb-3">

                                        <input id="qUnpaid" class="form-check-input" type="checkbox">

                                        <label class="form-check-label">

                                            僅顯示未付款

                                        </label>

                                    </div>

                                    <button id="btnSearch" class="btn btn-primary w-100">

                                        🔍 查詢收帳

                                    </button>

                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-2">

                                    <span id="searchTitle" class="fw-bold"></span>

                                    <span id="searchCount" class="badge bg-primary"></span>

                                </div>

                                <div class="receivable-list-wrapper">

                                    <div id="receivableList">

                                    </div>

                                </div>

                                <div id="emptyHint" class="empty-area d-none">

                                    查無收帳資料

                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- 右側 -->
                    <div class="col-lg-8">

                        <div id="formCard" class="card section-card shadow-sm d-none">

                            <div class="section-header d-flex justify-content-between">

                                <span>
                                    💰 收帳資料
                                </span>

                                <span id="editHint" class="badge bg-warning text-dark d-none">

                                    編輯模式

                                </span>

                            </div>

                            <div class="section-body">

                                <form id="receivableForm">

                                    <input id="ReceivableID" type="hidden">

                                    <!-- 基本 -->

                                    <h5 class="mb-3">

                                        📋 基本資料

                                    </h5>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                訂單ID

                                            </label>

                                            <input id="OrderID" class="form-control">

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                MemberID

                                            </label>

                                            <input id="MemberID" class="form-control">

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                付款人

                                            </label>

                                            <input id="PayerName" class="form-control">

                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 金額 -->

                                    <h5 class="mb-3">

                                        💰 金額資訊

                                    </h5>

                                    <div class="row">

                                        <div class="col-md-3 mb-3">

                                            <label class="form-label">

                                                金額

                                            </label>

                                            <input id="Amount" type="number" class="form-control">

                                        </div>

                                        <div class="col-md-3 mb-3">

                                            <label class="form-label">

                                                折扣

                                            </label>

                                            <input id="DiscountAmount" type="number" class="form-control">

                                        </div>

                                        <div class="col-md-3 mb-3">

                                            <label class="form-label">

                                                稅額

                                            </label>

                                            <input id="TaxAmount" type="number" class="form-control">

                                        </div>

                                        <div class="col-md-3 mb-3">

                                            <label class="form-label">

                                                退款金額

                                            </label>

                                            <input id="RefundAmount" type="number" class="form-control">

                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 付款 -->

                                    <h5 class="mb-3">

                                        💳 付款資訊

                                    </h5>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                付款方式

                                            </label>

                                            <select id="PaymentMethod" class="form-select">

                                                <option>現金</option>
                                                <option>轉帳</option>
                                                <option>LINE Pay</option>
                                                <option>信用卡</option>
                                                <option>月結</option>

                                            </select>

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                付款狀態

                                            </label>

                                            <select id="PaymentStatus" class="form-select">

                                                <option>未付款</option>
                                                <option>部分付款</option>
                                                <option>已付款</option>
                                                <option>退款</option>

                                            </select>

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                付款日期

                                            </label>

                                            <input id="PaymentDate" type="datetime-local" class="form-control">

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                交易編號

                                            </label>

                                            <input id="TransactionNo" class="form-control">

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                發票號碼

                                            </label>

                                            <input id="InvoiceNo" class="form-control">

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                退款日期

                                            </label>

                                            <input id="RefundDate" type="datetime-local" class="form-control">

                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 備註 -->

                                    <h5 class="mb-3">

                                        📝 備註

                                    </h5>

                                    <textarea id="Note" rows="5" class="form-control"></textarea>

                                    <hr>

                                    <div class="d-flex gap-2">

                                        <button id="btnCreate" type="button" class="btn btn-success">

                                            ➕ 新增

                                        </button>

                                        <button id="btnUpdate" type="button" class="btn btn-primary">

                                            💾 修改

                                        </button>

                                        <button id="btnDelete" type="button" class="btn btn-danger">

                                            🗑 刪除

                                        </button>

                                        <button id="btnClear" type="button" class="btn btn-secondary">

                                            🔄 清空

                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>

    <script src="../../js/pages/Receivable/Receivable.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Receivable");
        });
    </script>

</body>

</html>
