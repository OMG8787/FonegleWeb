<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜品牌資訊</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .copy-btn { cursor: pointer; margin-left: 6px; color: #6c757d; font-size: 14px; transition: 0.2s; user-select: none; }
        .copy-btn:hover { color: #000; transform: scale(1.1); }
        .note-block { white-space: pre-wrap; padding: 6px 0; border-bottom: 1px dashed #e5e5e5; }
        .note-block:last-child { border-bottom: 0; }
        .prod-line { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed #eee; }
        .prod-line:last-child { border-bottom: 0; }
        .prod-line .n { font-weight: 600; white-space: nowrap; }
        .prod-line .d { flex: 1; color: #555; }
        .prod-line .p { color: #b56b00; font-weight: 600; white-space: nowrap; }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">品牌資訊</h2>
                            <p class="text-muted mb-0" id="subTitle">報名或介紹專用，點 📋 即可複製；內容在「系統 → 公司與功能設定」編輯</p>
                        </div>
                    </div>
                </div>

                <div id="content"></div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="../js/settings.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/brand-blocks.js"></script>
    <script src="../js/pages/brand.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Brand");
        });
    </script>

</body>

</html>
