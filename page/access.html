<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜帳號審核與權限</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .access-table th,
        .access-table td {
            white-space: nowrap;
            vertical-align: middle;
        }

        .access-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f1f5f9;
            font-size: 13px;
        }

        .access-table th.perm,
        .access-table td.perm {
            text-align: center;
            width: 64px;
        }

        .access-table td.perm input {
            width: 1.2em;
            height: 1.2em;
            cursor: pointer;
        }

        .access-table tr.changed td {
            background: #fff8e1 !important;
        }

        .access-table tr.inactive td {
            color: #9ca3af;
        }

        .table-wrap {
            max-height: 65vh;
            overflow: auto;
        }

        .pending-card {
            border: 1px solid #fcd34d;
            background: #fffbeb;
            border-radius: 12px;
            padding: 12px 14px;
        }

        #saveBar {
            position: sticky;
            bottom: 0;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">👥 帳號審核與權限</h2>
                        <p class="text-muted mb-0">
                            新帳號需要在這裡核准才能登入。勾選每個帳號可以使用的模組，沒有勾選的模組，資料在伺服器端就會被擋下，看不到也改不了。
                        </p>
                    </div>
                </div>

                <!-- 待審核 -->
                <div id="pendingCard" class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="mb-2">🔔 待審核申請 <span id="pendingCount" class="badge bg-warning text-dark">0</span></h5>
                        <div id="pendingList" class="d-grid gap-2"></div>
                    </div>
                </div>

                <!-- 權限表 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                            <input id="qKeyword" class="form-control form-control-sm" style="max-width:220px" placeholder="搜尋姓名 / 電話 / Email">
                            <select id="qStatus" class="form-select form-select-sm" style="max-width:160px">
                                <option value="staff">有權限的帳號</option>
                                <option value="">全部帳號</option>
                                <option value="active">啟用中</option>
                                <option value="inactive">已停用</option>
                                <option value="pending">待審核</option>
                                <option value="rejected">已拒絕</option>
                            </select>
                            <span id="listCount" class="small text-muted"></span>
                        </div>

                        <div class="table-wrap">
                            <table class="table table-sm table-hover access-table mb-0">
                                <thead id="accessHead"></thead>
                                <tbody id="accessBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="saveBar" class="card border-0 shadow d-none mb-3">
                    <div class="card-body py-2 d-flex align-items-center gap-2">
                        <span class="fw-bold">✏️ <span id="changeCount">0</span> 個帳號有變更</span>
                        <button id="btnRevert" class="btn btn-sm btn-outline-secondary ms-auto">還原</button>
                        <button id="btnSave" class="btn btn-sm btn-primary">💾 儲存變更</button>
                    </div>
                </div>

                <!-- 說明 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-2">📖 各權限可以看到的資料</h5>
                        <div class="table-responsive">
                            <table class="table table-sm mb-0">
                                <thead class="table-light"><tr><th>權限</th><th>可以使用的功能 / 資料</th></tr></thead>
                                <tbody id="legendBody"></tbody>
                            </table>
                        </div>
                        <div class="small text-muted mt-2">
                            沒有任何權限的帳號，登入後只能看到首頁、自己的備忘錄、帳號設定與 AI 助理。
                            只有「最高管理員」可以授予或移除「最高管理員」；不能移除自己的管理權限。
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/access.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Access");
        });
    </script>

</body>

</html>
