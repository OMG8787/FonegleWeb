<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜製作報告</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .er-scroll { max-height: calc(100vh - 250px); min-height: 360px; overflow-y: auto; padding-right: 4px; }
        .er-preview { width: 100%; height: calc(100vh - 210px); min-height: 480px; border: 1px solid #dee2e6; border-radius: 10px; background: #eceff3; }
        .er-block { border: 1px solid #e5e5e5; border-radius: 10px; margin-bottom: 8px; background: #fff; }
        .er-block.active { border-color: #b9805f; box-shadow: 0 0 0 2px rgba(185, 128, 95, .25); }
        .er-bh { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f8f9fa; border-radius: 10px 10px 0 0; cursor: pointer; }
        .er-bh .t { flex: 1; font-weight: 600; font-size: .9rem; }
        .er-bh .sum { color: #888; font-weight: 400; font-size: .8rem; }
        .er-bh button { padding: 0 6px; line-height: 1.5; }
        .er-bb { padding: 10px; }
        .er-bb.d-none { display: none; }
        .er-drop { border: 2px dashed #ced4da; border-radius: 8px; padding: 10px; text-align: center; font-size: .82rem; color: #6c757d; cursor: pointer; outline: none; }
        .er-drop:hover, .er-drop:focus, .er-drop.over { border-color: #b9805f; background: #fff8f3; }
        .er-drop img { max-width: 100%; max-height: 90px; display: block; margin: 0 auto 4px; border-radius: 6px; }
        .er-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .er-thumb { width: 108px; font-size: .75rem; }
        .er-thumb img { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; }
        .er-rich { min-height: 90px; border: 1px solid #ced4da; border-radius: 0 0 6px 6px; padding: 8px 10px; background: #fff; font-size: .9rem; overflow-y: auto; max-height: 260px; }
        .er-rich:focus { outline: 2px solid rgba(185, 128, 95, .4); }
        .er-tb { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; border: 1px solid #ced4da; border-bottom: 0; border-radius: 6px 6px 0 0; background: #f8f9fa; align-items: center; }
        .er-tb button { min-width: 28px; }
        .er-tb input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid #ced4da; background: #fff; }
        .er-nested { margin-left: 10px; border-style: dashed; }
        .er-sub { border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 6px; background: #fcfcfc; }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">📄 製作報告</h2>
                            <p class="text-muted mb-0">用區塊組出報告、提案書、DM 或活動廣告單，即時預覽，可列印成 PDF 或下載 HTML（草稿自動存在這台電腦）</p>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button id="btnNew" class="btn btn-outline-secondary">🆕 新報告</button>
                            <button id="btnClearDraft" class="btn btn-outline-danger" title="清除這一頁的草稿，回到預設的空白報告">🧹 清除草稿</button>
                            <button id="btnDownload" class="btn btn-outline-primary">⬇️ 下載 HTML</button>
                            <button id="btnPrint" class="btn btn-success">🖨️ 列印 / 存成 PDF</button>
                        </div>
                    </div>
                </div>

                <div class="row g-3">

                    <!-- 編輯 -->
                    <div class="col-lg-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">

                                <ul class="nav nav-tabs mb-3" role="tablist">
                                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabContent" type="button">報告內容</button></li>
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabTheme" type="button">版面與品牌</button></li>
                                </ul>

                                <div class="tab-content">

                                    <div class="tab-pane fade show active" id="tabContent">

                                        <div class="er-sub">
                                            <div class="small fw-bold mb-1">🧱 範本</div>
                                            <div class="d-flex gap-1">
                                                <select id="tplSelect" class="form-select form-select-sm"></select>
                                                <button id="btnTpl" class="btn btn-sm btn-outline-primary text-nowrap">套用範本</button>
                                            </div>
                                            <div class="d-flex flex-wrap gap-1 mt-1">
                                                <button id="btnTplSave" class="btn btn-sm btn-outline-secondary" title="把目前的版面與內容存成自己的範本">💾 存成我的範本</button>
                                                <button id="btnTplDel" class="btn btn-sm btn-outline-danger" title="只能刪除「我的範本」">🗑️ 刪除</button>
                                                <button id="btnTplExport" class="btn btn-sm btn-outline-secondary" title="把目前內容下載成檔案，可在別台電腦匯入">⬇️ 匯出</button>
                                                <button id="btnTplImport" class="btn btn-sm btn-outline-secondary">⬆️ 匯入</button>
                                                <input id="tplFile" type="file" accept=".json,application/json" class="d-none">
                                            </div>
                                        </div>

                                        <div class="er-sub">
                                            <div class="small fw-bold mb-1">🔗 從系統資料帶入</div>
                                            <div class="d-flex gap-1 mb-1">
                                                <select id="srcKind" class="form-select form-select-sm w-auto">
                                                    <option value="event">行事曆活動</option>
                                                    <option value="product">產品</option>
                                                </select>
                                                <select id="srcRecord" class="form-select form-select-sm"></select>
                                            </div>
                                            <div class="d-flex gap-1">
                                                <button id="btnSrcBuild" class="btn btn-sm btn-outline-primary">用這筆資料建立</button>
                                                <button id="btnSrcRefill" class="btn btn-sm btn-outline-secondary" title="只更新自動帶入的區塊，你自己加的與手改的不會被覆蓋">重新帶入</button>
                                            </div>
                                        </div>

                                        <div class="d-flex gap-1 mb-2">
                                            <select id="addType" class="form-select form-select-sm"></select>
                                            <button id="btnAddBlock" class="btn btn-sm btn-primary text-nowrap">＋ 新增區塊</button>
                                        </div>

                                        <div class="d-flex gap-1 mb-2">
                                            <button id="btnCollapseAll" class="btn btn-sm btn-outline-secondary">全部收合</button>
                                            <button id="btnExpandAll" class="btn btn-sm btn-outline-secondary">全部展開</button>
                                            <span class="small text-muted ms-auto align-self-center">封面也能新增區塊：展開封面即可</span>
                                        </div>
                                        <div id="blockList" class="er-scroll"></div>
                                    </div>

                                    <div class="tab-pane fade" id="tabTheme">
                                        <div class="er-scroll" id="themeForm"></div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 預覽 -->
                    <div class="col-lg-7">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between small text-muted mb-2">
                                    <span>👁️ 即時預覽（點內容可跳到對應區塊）</span>
                                    <span class="d-flex gap-2 align-items-center">
                                        <label class="d-flex gap-1 align-items-center">縮放
                                            <select id="zoom" class="form-select form-select-sm py-0">
                                                <option value="0.6">60%</option><option value="0.75">75%</option><option value="0.9">90%</option><option value="1" selected>100%</option>
                                            </select></label>
                                        <span id="saveState"></span>
                                    </span>
                                </div>
                                <iframe id="preview" class="er-preview" sandbox="allow-same-origin allow-modals"></iframe>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/report-render.js"></script>
    <script src="../js/pages/report.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Report");
        });
    </script>

</body>

</html>
