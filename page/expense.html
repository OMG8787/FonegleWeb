<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜支出表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .stat-card .value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .table td,
        .table th {
            white-space: nowrap;
        }

        tr.clickable {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">💸 支出表</h2>
                            <p class="text-muted mb-0">公司所有支出：食材、包材、設備、租金、交通、人事、行銷…</p>
                        </div>
                        <button id="btnNew" class="btn btn-success">＋ 新增支出</button>
                    </div>
                </div>

                <!-- 統計 -->
                <div class="row g-2 mb-3">
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small" id="sumPeriodLabel">本月支出</div><div id="sumPeriod" class="value">$0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">今年累計</div><div id="sumYear" class="value">$0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">尚未付款</div><div id="sumUnpaid" class="value text-danger">$0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">最大宗分類</div><div id="sumTop" class="value">-</div>
                    </div></div></div>
                </div>

                <div class="row g-3">

                    <div class="col-lg-8">

                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-body">
                                <div class="row g-2 mb-3">
                                    <div class="col-6 col-md-3">
                                        <input id="qMonth" type="month" class="form-control form-control-sm" title="月份（空白 = 全部）">
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <select id="qCategory" class="form-select form-select-sm"></select>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <select id="qPaid" class="form-select form-select-sm">
                                            <option value="">全部</option>
                                            <option value="unpaid">未付款</option>
                                            <option value="paid">已付款</option>
                                        </select>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <input id="qKeyword" class="form-control form-control-sm" placeholder="項目 / 廠商">
                                    </div>
                                </div>

                                <h6 class="mb-2">分類統計</h6>
                                <div id="categoryBars" class="mb-3"></div>

                                <div class="d-flex justify-content-between small text-muted mb-1">
                                    <span>明細</span><span id="listSummary"></span>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-sm table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th>日期</th>
                                                <th>分類</th>
                                                <th>項目</th>
                                                <th>廠商</th>
                                                <th class="text-end">金額</th>
                                                <th>付款</th>
                                            </tr>
                                        </thead>
                                        <tbody id="listBody"></tbody>
                                    </table>
                                </div>
                                <div id="emptyHint" class="text-muted small d-none">沒有符合的支出</div>
                            </div>
                        </div>
                    </div>

                    <!-- 表單 -->
                    <div class="col-lg-4">
                        <div id="formCard" class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 id="formTitle" class="mb-0">➕ 新增支出</h5>
                                    <span id="editHint" class="badge bg-warning text-dark d-none">編輯中</span>
                                </div>

                                <form id="expenseForm" onsubmit="return false">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label small">日期 *</label>
                                            <input id="ExpenseDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">分類 *</label>
                                            <select id="Category" class="form-select"></select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">項目 *</label>
                                            <input id="ItemName" class="form-control" placeholder="例如：鮮乳 20L、市集攤位費">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">金額 *</label>
                                            <input id="Amount" type="number" min="0" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">付款方式</label>
                                            <select id="PaymentMethod" class="form-select">
                                                <option value="">—</option>
                                                <option>現金</option>
                                                <option>匯款</option>
                                                <option>信用卡</option>
                                                <option>電子支付</option>
                                                <option>其他</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">廠商 / 對象</label>
                                            <input id="Vendor" class="form-control" list="vendorList" placeholder="可輸入或從合作廠商選">
                                            <datalist id="vendorList"></datalist>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">發票 / 收據號碼</label>
                                            <input id="InvoiceNo" class="form-control">
                                        </div>
                                        <div class="col-6 d-flex align-items-end">
                                            <div class="form-check form-switch mb-2">
                                                <input id="IsPaid" class="form-check-input" type="checkbox" checked>
                                                <label class="form-check-label" for="IsPaid">已付款</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">備註</label>
                                            <textarea id="Note" rows="2" class="form-control"></textarea>
                                        </div>
                                    </div>

                                    <div class="d-flex flex-wrap gap-2 mt-3">
                                        <button id="btnCreate" class="btn btn-success">新增</button>
                                        <button id="btnUpdate" class="btn btn-primary">儲存修改</button>
                                        <button id="btnDelete" class="btn btn-outline-danger">刪除</button>
                                        <button id="btnClear" class="btn btn-outline-secondary ms-auto">清除</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/expense.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Expense");
        });
    </script>

</body>

</html>
