<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜保證金追蹤</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .stat-card .value { font-size: 1.4rem; font-weight: bold; }
        .table td, .table th { white-space: nowrap; vertical-align: middle; }
        tr.clickable { cursor: pointer; }
        tr.active td { background: #eef5ff !important; }
        .list-wrap { max-height: calc(100vh - 360px); min-height: 240px; overflow-y: auto; }
        @media (max-width: 991.98px) { .list-wrap { max-height: 60vh; } }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>
                            <h2 class="mb-1">🔖 保證金追蹤</h2>
                            <p class="text-muted mb-0">市集、場地、廠商的保證金 / 押金：付了多少、什麼時候該退、退了沒。在行事曆建立活動時填保證金會自動加入；活動結束隔天或取消時，會出現在首頁待辦與提醒中心。</p>
                        </div>
                        <button id="btnNew" class="btn btn-success">＋ 新增保證金</button>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">未退還</div><div id="sumOpen" class="value text-danger">$0</div><div id="sumOpenNote" class="small text-muted"></div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">已逾期未退</div><div id="sumOverdue" class="value text-danger">$0</div><div id="sumOverdueNote" class="small text-muted"></div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">已退還</div><div id="sumBack" class="value text-success">$0</div>
                    </div></div></div>
                    <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm stat-card"><div class="card-body">
                        <div class="text-muted small">被扣 / 未全額退</div><div id="sumLost" class="value">$0</div>
                    </div></div></div>
                </div>

                <div class="row g-3">

                    <div class="col-lg-7">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex flex-wrap gap-2 mb-2">
                                    <select id="qStatus" class="form-select form-select-sm" style="max-width:160px">
                                        <option value="open">未退還</option>
                                        <option value="back">已退還</option>
                                        <option value="">全部</option>
                                    </select>
                                    <input id="qKeyword" class="form-control form-control-sm" style="max-width:240px" placeholder="活動 / 主辦 / 備註">
                                    <span id="listCount" class="small text-muted align-self-center"></span>
                                </div>
                                <div class="list-wrap table-responsive">
                                    <table class="table table-sm table-hover mb-0">
                                        <thead class="table-light">
                                            <tr><th>活動日</th><th>活動 / 主辦</th><th class="text-end">保證金</th><th>應退日</th><th>狀態</th></tr>
                                        </thead>
                                        <tbody id="listBody"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div id="formCard" class="card border-0 shadow-sm">
                            <div class="card-body">
                                <h5 id="formTitle" class="mb-3">➕ 新增保證金</h5>
                                <form id="depForm" onsubmit="return false">
                                    <div class="mb-2">
                                        <label class="form-label small">從出攤紀錄帶入（選填）</label>
                                        <select id="StallId" class="form-select form-select-sm"></select>
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label small">活動日期</label>
                                            <input id="EventDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">保證金 *</label>
                                            <input id="Amount" type="number" min="0" class="form-control">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">活動名稱</label>
                                            <input id="EventName" class="form-control">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">付款對象（主辦 / 廠商）*</label>
                                            <input id="Payee" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">付出日期</label>
                                            <input id="PaidDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">預計退還日</label>
                                            <input id="ExpectReturnDate" type="date" class="form-control">
                                            <div class="form-text">空白 = 活動日後 14 天</div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">實際退還日</label>
                                            <input id="ReturnedDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">退還金額</label>
                                            <input id="ReturnedAmount" type="number" min="0" class="form-control">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small">備註</label>
                                            <textarea id="Note" rows="2" class="form-control" placeholder="例如：扣電費 500、要帶收據才能退"></textarea>
                                        </div>
                                    </div>
                                    <div class="d-flex flex-wrap gap-2 mt-3">
                                        <button id="btnCreate" class="btn btn-success">新增</button>
                                        <button id="btnUpdate" class="btn btn-primary">儲存修改</button>
                                        <button id="btnReturned" class="btn btn-outline-success">↩️ 今天已全額退還</button>
                                        <button id="btnDelete" class="btn btn-outline-danger ms-auto">刪除</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/billing.js"></script>
    <script src="../js/pages/deposit.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Deposit");
        });
    </script>

</body>

</html>
