<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜生產履歷</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#c48b6a">
    <script src="../js/theme.js?v=202610281105"></script>
    <link href="../css/dark.css?v=202610281105" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/js/tom-select.complete.min.js"></script>

    <!-- 共用樣式 -->
    <link href="../css/layout.css?v=202610281105" rel="stylesheet">

    <style>
        /* ===========================================
   ProductionLog
=========================================== */

        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        .search-area {
            padding: 20px;
        }

        .search-area label {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
        }

        .search-area .form-control,
        .search-area .form-select {
            border-radius: 10px;
        }

        .search-area .btn {
            height: 46px;
            border-radius: 10px;
        }

        .production-list-wrapper {

            max-height: 720px;
            overflow-y: auto;

        }

        .production-card {

            border: 1px solid #e8e8e8;
            border-radius: 12px;

            padding: 14px;

            margin-bottom: 12px;

            cursor: pointer;

            transition: .25s;

            background: white;

        }

        .production-card:hover {

            border-color: #2563eb;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

        }

        .production-card.active {

            border: 2px solid #2563eb;

            background: #eef5ff;

        }

        .production-title {

            font-size: 17px;

            font-weight: 700;

            color: #222;

            margin-bottom: 8px;

        }

        .production-info {

            font-size: 13px;

            color: #666;

            line-height: 1.8;

        }

        .production-info span {

            display: inline-block;

            margin-right: 14px;

        }

        .empty-area {

            padding: 60px 20px;

            text-align: center;

            color: #999;

            font-size: 15px;

        }

        #productionForm label {

            font-weight: 600;

            color: #555;

        }

        #productionForm .form-control,
        #productionForm .form-select {

            border-radius: 10px;

        }

        #productionForm textarea {

            resize: vertical;

        }

        #productionForm hr {

            margin: 30px 0;

        }

        #productionForm h5 {

            font-weight: 700;

            color: #333;

        }

        #editHint {

            font-size: 13px;

        }

        .d-flex.gap-2 button {

            min-width: 110px;

        }

        input[readonly] {

            background: #f8f9fa;

        }

        .form-control:focus,
        .form-select:focus {

            border-color: #2563eb;

            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .15);

        }

        .badge {

            font-size: 12px;

        }

        @media (max-width:992px) {

            .production-list-wrapper {

                max-height: none;

            }

            .d-flex.gap-2 {

                flex-wrap: wrap;

            }

            .d-flex.gap-2 button {

                flex: 1 1 calc(50% - 8px);

            }

        }

        @media (max-width:768px) {

            .section-header {

                font-size: 16px;

            }

            .search-area {

                padding: 15px;

            }

            .section-body {

                padding: 15px;

            }

            .production-title {

                font-size: 15px;

            }

            .production-info {

                font-size: 12px;

            }

            .d-flex.gap-2 button {

                flex: 1 1 100%;

            }

        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">生產履歷</h2>
                        <p class="text-muted mb-0">
                            記錄每一批生產：選產品自動帶入配方、單位與保存天數，批號自動產生流水號
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->

                <div class="row">

                    <!-- 左側 -->
                    <div class="col-lg-4">

                        <div class="card section-card shadow-sm mb-3">

                            <div class="search-area">

                                <input id="qBatchNo" class="form-control mb-2" placeholder="📦 批號">

                                <input id="qProductName" class="form-control mb-2" placeholder="🍦 商品名稱">

                                <input id="qFormulaID" class="form-control mb-2" placeholder="🧪 配方編號">

                                <input id="qFactory" class="form-control mb-2" placeholder="🏢 工廠">

                                <input id="qProductionLine" class="form-control mb-2" placeholder="🏭 生產線">

                                <input id="qOperatorName" class="form-control mb-2" placeholder="👨‍🔧 作業員">

                                <label class="form-label">
                                    製造日期
                                </label>

                                <input id="qMfgDate" type="date" class="form-control mb-2">

                                <label class="form-label">
                                    有效日期
                                </label>

                                <input id="qExpDate" type="date" class="form-control mb-2">

                                <select id="qStatus" class="form-select mb-3">

                                    <option value="">
                                        全部狀態
                                    </option>

                                    <option>
                                        待生產
                                    </option>

                                    <option>
                                        生產中
                                    </option>

                                    <option>
                                        已完成
                                    </option>

                                    <option>
                                        已取消
                                    </option>

                                </select>

                                <button id="btnSearch" class="btn btn-primary w-100">

                                    🔍 查詢生產紀錄

                                </button>

                            </div>

                            <hr>

                            <div class="section-body">

                                <div class="d-flex justify-content-between align-items-center mb-2">

                                    <span id="searchTitle" class="fw-bold">
                                    </span>

                                    <span id="searchCount" class="badge bg-primary">
                                    </span>

                                </div>

                                <div class="production-list-wrapper">

                                    <div id="productionList">

                                    </div>

                                </div>

                                <div id="emptyHint" class="empty-area d-none">

                                    查無資料

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- ========================= -->
                    <!-- 右側 -->
                    <!-- ========================= -->

                    <div class="col-lg-8">

                        <div id="formCard" class="card section-card shadow-sm d-none">

                            <div class="section-header d-flex justify-content-between">

                                <span>

                                    🏭 生產紀錄

                                </span>

                                <span id="editHint" class="badge bg-warning text-dark d-none">

                                    編輯模式

                                </span>

                            </div>

                            <div class="section-body">

                                <form id="productionForm">

                                    <h5 class="mb-3">
                                        基本資訊
                                    </h5>

                                    <div class="row">
                                        <div class="col-md-8 mb-3">
                                            <label class="form-label" for="ProductSelect">
                                                產品名稱 <span class="text-danger">*</span>
                                            </label>
                                            <select id="ProductSelect"></select>
                                            <div class="form-text">只能選已建立的產品，打字即可搜尋（例如「芒冰」找得到「芒果冰淇淋」）</div>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                產品編號（系統帶入）
                                            </label>
                                            <input id="ProductID" class="form-control" readonly tabindex="-1">
                                        </div>
                                        <div class="col-md-8 mb-3">
                                            <label class="form-label">
                                                配方（依產品帶入）
                                            </label>
                                            <input id="FormulaName" class="form-control" readonly tabindex="-1" placeholder="選產品後自動帶入">
                                            <input id="FormulaID" type="hidden">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                生產編號（自動產生）
                                            </label>
                                            <input id="ProductionID" class="form-control" readonly tabindex="-1">
                                        </div>
                                        <div class="col-md-8 mb-3">
                                            <label class="form-label" for="BatchNo">
                                                批號（自動流水號，可修改）
                                            </label>
                                            <div class="input-group">
                                                <input id="BatchNo" class="form-control" maxlength="40">
                                                <button type="button" id="btnBatchNo" class="btn btn-outline-secondary" title="依製造日期重新產生流水號">🔄 重新產生</button>
                                            </div>
                                            <div id="batchHint" class="form-text">格式：P + 製造日期（年月日）+ 當天序號，例如 P26102701</div>
                                        </div>
                                    </div>

                                    <hr>

                                    <h5 class="mb-3">
                                        生產資訊
                                    </h5>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                工廠
                                            </label>
                                            <select id="Factory"></select>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                生產線
                                            </label>
                                            <select id="ProductionLine"></select>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                預計數量
                                            </label>
                                            <input id="PlannedQty" type="number" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                完成數量
                                            </label>
                                            <input id="ProducedQty" type="number" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                NG數量
                                            </label>
                                            <input id="NGQty" type="number" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                單位
                                            </label>
                                            <input id="Unit" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                作業員
                                            </label>
                                            <select id="OperatorName"></select>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                主管
                                            </label>
                                            <select id="SupervisorName"></select>
                                        </div>

                                    </div>

                                    <hr>

                                    <h5 class="mb-3">
                                        生產時間
                                    </h5>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                開始時間
                                            </label>
                                            <input id="StartTime" type="datetime-local" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                結束時間
                                            </label>
                                            <input id="EndTime" type="datetime-local" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label" for="MfgDate">
                                                製造日期
                                            </label>
                                            <input id="MfgDate" type="date" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label" for="ShelfDays">
                                                保存天數
                                            </label>
                                            <div class="input-group">
                                                <input id="ShelfDays" type="number" min="0" step="1" class="form-control" placeholder="例如 30">
                                                <span class="input-group-text">天</span>
                                            </div>
                                            <div id="shelfHint" class="form-text"></div>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label" for="ExpDate">
                                                有效日期（系統帶入，可修改）
                                            </label>
                                            <input id="ExpDate" type="date" class="form-control">
                                            <div class="form-text">＝ 製造日期 + 保存天數；直接改日期會反算天數</div>
                                        </div>

                                    </div>

                                    <hr>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            生產狀態
                                        </label>

                                        <select id="Status" class="form-select">

                                            <option>待生產</option>
                                            <option>生產中</option>
                                            <option>已完成</option>
                                            <option>已取消</option>

                                        </select>

                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            生產說明
                                        </label>

                                        <textarea id="Description" rows="3" class="form-control"></textarea>

                                    </div>

                                    <div class="mb-4">

                                        <label class="form-label">
                                            備註
                                        </label>

                                        <textarea id="Remark" rows="4" class="form-control"></textarea>

                                    </div>

                                    <div class="d-flex gap-2">

                                        <button type="button" id="btnCreate" class="btn btn-success">

                                            ➕ 新增

                                        </button>

                                        <button type="button" id="btnUpdate" class="btn btn-primary">

                                            💾 修改

                                        </button>

                                        <button type="button" id="btnDelete" class="btn btn-danger">

                                            🗑 刪除

                                        </button>

                                        <button type="button" id="btnClear" class="btn btn-secondary">

                                            🔄 清空

                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js?v=202610281105"></script>
    <script src="../js/site.js?v=202610281105"></script>
    <script src="../js/auth.js?v=202610281105"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js?v=202610281105"></script>
    <script src="../js/api.js?v=202610281105"></script>
    <script src="../js/layout.js?v=202610281105"></script>
    <script src="../js/core.js?v=202610281105"></script>
    <script src="../js/ai-chat.js?v=202610281105"></script>
    <script src="../js/favorite.js?v=202610281105"></script>

    <script src="../js/pages/production.js?v=202610281105"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("ProductionLog");
        });
    </script>

</body>

</html>
