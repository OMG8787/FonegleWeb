<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜訂單管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

    <style>
        /* ===========================
        訂單管理樣式
        =========================== */

        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        /* 搜尋區 */
        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        /* 訂單列表 */
        .order-list-wrapper {
            max-height: calc(100vh - 320px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }

        .order-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            cursor: pointer;
            transition: .2s;
        }

        .order-card:hover {
            box-shadow:
                0 4px 12px rgba(0, 0, 0, .08);
            transform: translateY(-2px);
        }

        .order-card.active {
            border: 2px solid #0d6efd;
            background: #eef6ff;
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .member-info {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 4px;
        }

        /* 空資料 */
        .empty-area {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        /* 表單 */
        .required {
            color: #dc3545;
            font-weight: bold;
        }

        /* 訂單商品表格 */
        #orderDetailList input {
            min-width: 80px;
        }

        #orderDetailList td {
            vertical-align: middle;
        }

        /* 編輯模式 */
        #editHint {
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* 按鈕 */
        .btn-action {
            min-width: 100px;
        }

        /* 狀態標籤 */
        .order-status {
            display: inline-flex;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            background: #eff6ff;
            color: #2563eb;
        }

        /* 金額欄位 */
        #TotalAmount {
            font-weight: bold;
            background: #f8fafc;
        }

        /* 手機版 */
        @media(max-width:768px) {
            .order-list-wrapper {
                max-height: none;
            }

            .section-body {
                padding: 15px;
            }

            .order-card {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- 頁首 -->
    <div id="headerArea"></div>
    <!-- 主架構 -->
    <div id="erp-layout">
        <!-- 導覽列 -->
        <div id="sidebarArea"></div>
        <!-- 主內容 -->
        <div id="erp-main">
            <div class="container-fluid">
                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">訂單管理</h2>
                        <p class="text-muted mb-0">
                            出貨狀況/訂單資訊
                        </p>
                        <button type="button" id="btnNew" class="btn btn-success">
                            ➕ 建立新訂單
                        </button>
                    </div>
                </div>
                <!-- 內容在這 -->
                <div class="row">
                    <!-- 左側：搜尋與訂單列表 -->
                    <div class="col-lg-4">
                        <div class="card section-card shadow-sm mb-3">
                            <div class="section-header">
                                🔍 訂單查詢
                            </div>
                            <div class="section-body">
                                <div class="search-area">
                                    選擇訂購人
                                    <!-- 訂購公司 -->
                                    <select id="qMemberID" class="form-select mb-2"></select>
                                    <!-- 預計出貨時間 -->
                                    <label class="form-label">
                                        📦 預計出貨日期
                                    </label>
                                    <input id="qExpectedShippingDate" type="date" class="form-control mb-3">
                                    <!-- 下單時間 -->
                                    <label class="form-label">
                                        🕒 下單日期
                                    </label>
                                    <input id="qOrderDate" type="date" class="form-control mb-3">

                                    <!-- 單號 -->
                                    訂單編號
                                    <input id="qOrderNo" class="form-control mb-3" placeholder="🧾 訂單編號">

                                    <select id="qShippingStatus" class="form-select">

                                        <option value="">全部出貨狀態</option>
                                        <option value="未配送">未配送</option>
                                        <option value="配送中">配送中</option>
                                        <option value="已完成">已完成</option>

                                    </select>
                                    <button id="btnSearch" class="btn btn-primary w-100">
                                        🔍 查詢訂單
                                    </button>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span id="searchTitle" class="fw-bold">
                                    </span>
                                    <span id="searchCount" class="badge bg-primary">
                                    </span>
                                </div>
                                <div class="order-list-wrapper">
                                    <div id="orderList">
                                    </div>
                                </div>
                                <div id="emptyHint" class="empty-area d-none">
                                    查無訂單
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 右側：訂單資料 -->
                    <div class="col-lg-8">
                        <div id="formCard" class="card section-card shadow-sm d-none">
                            <div class="section-header d-flex justify-content-between">
                                <span>
                                    🧾 訂單資料
                                </span>
                                <span id="editHint" class="badge bg-warning text-dark d-none">
                                    編輯模式
                                </span>
                            </div>
                            <div class="section-body">
                                <form id="orderForm">
                                    <input type="hidden" id="OrderID">
                                    <!-- 訂單基本 -->
                                    <h5 class="mb-3">
                                        📋 訂單基本資料
                                    </h5>
                                    <div class="row">

                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                訂單編號
                                            </label>
                                            <input id="OrderNo" class="form-control" readonly>
                                        </div>

                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                下單時間
                                            </label>

                                            <input id="OrderDate" type="datetime-local" class="form-control">
                                        </div>

                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                建立時間
                                            </label>
                                            <input id="CreatedAt" class="form-control" readonly>
                                        </div>

                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                更新時間
                                            </label>
                                            <input id="UpdatedAt" class="form-control" readonly>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                銷售來源
                                            </label>
                                            <select id="SalesChannel" class="form-select">
                                                <option>LINE</option>
                                                <option>官網</option>
                                                <option>門市</option>
                                                <option>B2B</option>
                                                <option>其他</option>
                                            </select>
                                        </div>

                                    </div>
                                    <hr>
                                    <!-- 客戶資料 -->
                                    <h5 class="mb-3">
                                        🏢 訂購人資料
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                MemberID
                                            </label>
                                            <select id="MemberID" class="form-select"></select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                訂購人 / 公司名稱
                                            </label>
                                            <input id="MemberName" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                聯絡電話
                                            </label>
                                            <input id="MemberPhone" class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                Email
                                            </label>
                                            <input id="MemberEmail" class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                收件地址
                                            </label>
                                            <input id="ShippingAddress" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <!-- 商品明細 -->
                                    <h5 class="mb-3">
                                        📦 商品明細
                                    </h5>
                                    <div class="table-responsive">
                                        <table class="table table-bordered">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>
                                                        商品名稱
                                                    </th>
                                                    <th>
                                                        SKU
                                                    </th>
                                                    <th>
                                                        數量
                                                    </th>
                                                    <th>
                                                        單位
                                                    </th>
                                                    <th>
                                                        單價
                                                    </th>
                                                    <th>
                                                        小計
                                                    </th>
                                                    <th>
                                                        操作
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody id="orderDetailList">
                                            </tbody>
                                        </table>
                                    </div>
                                    <button type="button" id="btnAddDetail" class="btn btn-outline-primary btn-sm mb-3">
                                        ➕ 加入商品
                                    </button>
                                    <hr>
                                    <!-- 金額 -->
                                    <h5 class="mb-3">
                                        💰 金額資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                折扣金額
                                            </label>
                                            <input id="DiscountAmount" type="number" class="form-control" value="0">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                運費
                                            </label>
                                            <input id="ShippingFee" type="number" class="form-control" value="0">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                總金額
                                            </label>
                                            <input id="TotalAmount" type="number" class="form-control" readonly>
                                        </div>
                                    </div>
                                    <hr>
                                    <!-- 狀態 -->
                                    <h5 class="mb-3">
                                        🚚 付款與配送
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                付款方式
                                            </label>
                                            <select id="PaymentMethod" class="form-select">
                                                <option>
                                                    現金
                                                </option>
                                                <option>
                                                    轉帳
                                                </option>
                                                <option>
                                                    LINE Pay
                                                </option>
                                                <option>
                                                    信用卡
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                付款狀態
                                            </label>
                                            <select id="PaymentStatus" class="form-select">
                                                <option>
                                                    未付款
                                                </option>
                                                <option>
                                                    已付款
                                                </option>
                                                <option>
                                                    退款
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                訂單狀態
                                            </label>
                                            <select id="OrderStatus" class="form-select">
                                                <option>
                                                    待確認
                                                </option>
                                                <option>
                                                    製作中
                                                </option>
                                                <option>
                                                    待出貨
                                                </option>
                                                <option>
                                                    已出貨
                                                </option>
                                                <option>
                                                    完成
                                                </option>
                                                <option>
                                                    取消
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                配送狀態
                                            </label>
                                            <select id="ShippingStatus" class="form-select">
                                                <option>
                                                    未配送
                                                </option>
                                                <option>
                                                    配送中
                                                </option>
                                                <option>
                                                    已完成
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                預計出貨日期
                                            </label>
                                            <input id="ExpectedShippingDate" type="date" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        📝 備註
                                    </h5>
                                    <textarea id="Note" class="form-control" rows="5"></textarea>
                                    <hr>
                                    <div class="d-flex gap-2 flex-wrap">
                                        <button type="button" id="btnCreate" class="btn btn-primary">
                                            💾 新增
                                        </button>

                                        <button type="button" id="btnUpdate" class="btn btn-warning">
                                            ✏ 修改
                                        </button>

                                        <button type="button" id="btnDelete" class="btn btn-danger">
                                            🗑 刪除
                                        </button>

                                        <button type="button" id="btnClear" class="btn btn-secondary">
                                            🔄 清空
                                        </button>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <div id="footerArea"></div>
    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>
    <script src="../../js/pages/Order/Order.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Order");
        });
    </script>

</body>

</html>
