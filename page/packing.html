<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>內部管理系統｜出攤備品清單</title>
    <link rel="icon" type="image/png" href="../img/logoicon.png">
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#c48b6a">
    <script src="../js/theme.js?v=202610281048"></script>
    <link href="../css/dark.css?v=202610281048" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css?v=202610281048" rel="stylesheet">

    <style>
        .list-item {
            cursor: pointer;
            border-radius: 10px;
        }

        .list-item.active {
            outline: 2px solid var(--bs-primary);
        }

        .packed td.name {
            text-decoration: line-through;
            opacity: .6;
        }

        .pk-qty {
            width: 80px;
        }

        @media print {

            #headerArea,
            #sidebarArea,
            #footerArea,
            .no-print {
                display: none !important;
            }

            #erp-main {
                margin: 0 !important;
            }

            .col-lg-8 {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3 no-print">
                    <div class="card-body">
                        <h2 class="mb-1">🧺 出攤備品清單</h2>
                        <p class="text-muted mb-0">每次出攤要帶的產品與物件，想到就加上；出發前打開清單逐項打勾核對。</p>
                    </div>
                </div>

                <div class="row g-3">

                    <!-- 左：選擇出攤活動 -->
                    <div class="col-lg-4 no-print">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="mb-0">📅 出攤活動</h5>
                                    <button id="btnNewList" type="button" class="btn btn-sm btn-outline-primary">＋ 自訂清單</button>
                                </div>
                                <div class="small text-muted mb-2">行事曆上接下來的活動會自動列在這裡，點一下開始整理清單。</div>
                                <div id="eventList" class="d-flex flex-column gap-2"></div>
                                <details class="mt-3">
                                    <summary class="small text-muted">過去的清單</summary>
                                    <div id="pastList" class="d-flex flex-column gap-2 mt-2"></div>
                                </details>
                            </div>
                        </div>
                    </div>

                    <!-- 右：清單 -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">

                                <div id="noList" class="text-center text-muted py-5">👈 先從左邊選一個出攤活動，或建立自訂清單</div>

                                <div id="listArea" class="d-none">
                                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                                        <div>
                                            <h4 id="listTitle" class="mb-0"></h4>
                                            <div id="listDate" class="small text-muted"></div>
                                        </div>
                                        <div class="d-flex flex-wrap gap-1 no-print">
                                            <button id="btnCopyFrom" type="button" class="btn btn-sm btn-outline-secondary">📋 從其他清單複製</button>
                                            <button id="btnUncheckAll" type="button" class="btn btn-sm btn-outline-secondary">↺ 全部取消勾選</button>
                                            <button id="btnPrint" type="button" class="btn btn-sm btn-outline-secondary">🖨️ 列印</button>
                                        </div>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 mb-3">
                                        <div class="progress flex-grow-1" style="height: 10px">
                                            <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
                                        </div>
                                        <span id="progressText" class="small fw-bold text-nowrap"></span>
                                    </div>

                                    <!-- 想到就加 -->
                                    <div class="border rounded p-2 mb-3 no-print">
                                        <div class="row g-2 align-items-end">
                                            <div class="col-12 col-md-auto">
                                                <div class="btn-group btn-group-sm" role="group">
                                                    <input type="radio" class="btn-check" name="pkType" id="pkTypeProduct" value="產品" checked>
                                                    <label class="btn btn-outline-primary" for="pkTypeProduct">🍨 產品</label>
                                                    <input type="radio" class="btn-check" name="pkType" id="pkTypeItem" value="物件">
                                                    <label class="btn btn-outline-primary" for="pkTypeItem">🧰 物件</label>
                                                </div>
                                            </div>
                                            <div class="col-12 col-md">
                                                <input id="pkName" class="form-control form-control-sm" list="pkNames" placeholder="想到什麼就打什麼，例如：草莓冰淇淋、帳篷、零錢" autocomplete="off">
                                                <datalist id="pkNames"></datalist>
                                            </div>
                                            <div class="col-4 col-md-auto">
                                                <input id="pkQty" type="number" min="0" step="any" class="form-control form-control-sm pk-qty" placeholder="數量">
                                            </div>
                                            <div class="col-4 col-md-auto">
                                                <input id="pkUnit" class="form-control form-control-sm pk-qty" placeholder="單位">
                                            </div>
                                            <div class="col-12 col-md-3">
                                                <input id="pkNote" class="form-control form-control-sm" placeholder="備註（選填）">
                                            </div>
                                            <div class="col-4 col-md-auto">
                                                <button id="btnAdd" type="button" class="btn btn-sm btn-success w-100">＋ 加入</button>
                                            </div>
                                        </div>
                                        <div class="small text-muted mt-1">按 Enter 也可以加入；同樣的東西再加一次會把數量加上去。</div>
                                    </div>

                                    <h6 class="mt-2">🍨 產品</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm align-middle">
                                            <tbody id="productRows"></tbody>
                                        </table>
                                    </div>

                                    <h6 class="mt-2">🧰 物件 / 設備</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm align-middle mb-0">
                                            <tbody id="itemRows"></tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js?v=202610281048"></script>
    <script src="../js/site.js?v=202610281048"></script>
    <script src="../js/auth.js?v=202610281048"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js?v=202610281048"></script>
    <script src="../js/api.js?v=202610281048"></script>
    <script src="../js/layout.js?v=202610281048"></script>
    <script src="../js/core.js?v=202610281048"></script>
    <script src="../js/ai-chat.js?v=202610281048"></script>
    <script src="../js/favorite.js?v=202610281048"></script>
    <script src="../js/pages/packing.js?v=202610281048"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Packing");
        });
    </script>

</body>

</html>
