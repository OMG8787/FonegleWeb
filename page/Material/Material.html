<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜原料控管</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <style>
        /* =========================
        Material
        ========================= */

        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #4f8dfd;
            color: #fff;
            padding: 14px 18px;
            font-size: 17px;
            font-weight: 600;
        }

        .section-body {
            padding: 18px;
        }

        .search-area {
            padding: 18px;
            border-bottom: 1px solid #ececec;
            background: #fafafa;
        }

        .material-list-wrapper {
            height: 720px;
            overflow-y: auto;
        }

        .material-card {
            border-bottom: 1px solid #eee;
            padding: 14px 16px;
            cursor: pointer;
            transition: .2s;
        }

        .material-card:hover {
            background: #f5f8ff;
        }

        .material-card.active {
            background: #edf5ff;
            border-left: 5px solid #4f8dfd;
        }

        .material-name {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .material-id {
            font-size: 12px;
            color: #888;
        }

        .material-info {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .material-info span {
            font-size: 12px;
            background: #eef2ff;
            color: #3b5bcc;
            padding: 3px 8px;
            border-radius: 30px;
        }

        .stock-good {
            color: #198754;
            font-weight: 700;
        }

        .stock-low {
            color: #dc3545;
            font-weight: 700;
        }

        .empty-area {
            text-align: center;
            color: #888;
            padding: 80px 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        textarea.form-control {
            resize: vertical;
        }

        .table th {
            white-space: nowrap;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        .badge-status {
            font-size: 12px;
            padding: 5px 10px;
        }

        .card hr {
            margin: 1.5rem 0;
        }

        .btn {
            border-radius: 10px;
        }

        #editHint {
            font-size: 13px;
        }

        #materialForm input[readonly] {
            background: #f7f7f7;
        }

        .material-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #ececec;
            padding: 15px;
            text-align: center;
        }

        .summary-title {
            color: #777;
            font-size: 13px;
        }

        .summary-value {
            margin-top: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cfcfcf;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        /* =========================
            響應式
            ========================= */
        @media(max-width:992px) {
            .material-list-wrapper {
                height: 420px;
            }

            .material-summary {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:768px) {

            .section-body,
            .search-area {
                padding: 14px;
            }

            .d-flex.gap-2 {
                flex-wrap: wrap;
            }

            .d-flex.gap-2 .btn {
                flex: 1 1 calc(50% - 8px);
            }
        }
    </style>
</head>

<body>
    <!-- 頁首 -->
    <div id="headerArea"></div>
    <!-- 主架構 -->
    <div id="erp-layout">
        <!-- 導覽列 -->
        <div id="sidebarArea"></div>
        <!-- 主內容 -->
        <div id="erp-main">
            <div class="container-fluid">
                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">原料控管</h2>
                        <p class="text-muted mb-0">
                            原料來源、價格、廠商資料
                        </p>
                    </div>
                </div>
                <!-- 內容在這 -->
                <div class="row">
                    <!-- ========================= -->
                    <!-- 左側：搜尋 -->
                    <!-- ========================= -->
                    <div class="col-lg-4">
                        <div class="card section-card shadow-sm mb-3">
                            <div class="search-area">
                                <input id="qMaterialName" class="form-control mb-2" placeholder="🥛 原料名稱">
                                <input id="qCategory" class="form-control mb-2" placeholder="📂 分類">
                                <select id="qSupplierID" class="form-control mb-2" placeholder="🏢 廠商資料"></select>
                                <input id="qBarcode" class="form-control mb-2" placeholder="🏷 Barcode">
                                <input id="qSpecification" class="form-control mb-2" placeholder="📏 規格">
                                <input id="qOriginCountry" class="form-control mb-2" placeholder="🌍 產地">
                                <div class="form-check form-switch mb-2">
                                    <input id="qLowStock" class="form-check-input" type="checkbox">
                                    <label class="form-check-label">
                                        庫存不足
                                    </label>
                                </div>
                                <div class="form-check form-switch mb-3">
                                    <input id="qIsActive" class="form-check-input" type="checkbox" checked>
                                    <label class="form-check-label">
                                        只顯示啟用
                                    </label>
                                </div>
                                <div class="d-grid gap-2">
                                    <button id="btnSearch" class="btn btn-primary">
                                        🔍 查詢原料
                                    </button>
                                    <button id="btnNew" class="btn btn-success">
                                        ➕ 新增原料
                                    </button>
                                </div>
                            </div>
                            <hr>
                            <div class="section-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span id="searchTitle" class="fw-bold">
                                    </span>
                                    <span id="searchCount" class="badge bg-primary">
                                    </span>
                                </div>
                                <div class="material-list-wrapper">
                                    <div id="materialList">
                                    </div>
                                </div>
                                <div id="emptyHint" class="empty-area d-none">
                                    查無原料資料
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ========================= -->
                    <!-- 右側 -->
                    <!-- ========================= -->
                    <div class="col-lg-8">
                        <div id="formCard" class="card section-card shadow-sm d-none">
                            <div class="section-header d-flex justify-content-between">
                                <span>
                                    🥛 原料管理
                                </span>
                                <span id="editHint" class="badge bg-warning text-dark d-none">
                                    編輯模式
                                </span>
                            </div>
                            <div class="section-body">
                                <form id="materialForm">
                                    <!-- 基本資料 -->
                                    <h5 class="mb-3">
                                        📋 基本資料
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                MaterialID
                                            </label>
                                            <input id="ID" class="form-control" readonly>
                                        </div>
                                        <div class="col-md-8 mb-3">
                                            <label class="form-label">
                                                原料名稱
                                            </label>
                                            <input id="MaterialName" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                分類
                                            </label>
                                            <input id="Category" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                廠商資料
                                            </label>
                                            <select id="SupplierID" class="form-select">
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                Barcode
                                            </label>
                                            <input id="Barcode" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <!-- 庫存 -->
                                    <h5 class="mb-3">
                                        📦 庫存資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                庫存
                                            </label>
                                            <input id="CurrentStock" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                最低庫存
                                            </label>
                                            <input id="MinStock" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                單位
                                            </label>
                                            <input id="Unit" class="form-control">
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">
                                                成本
                                            </label>
                                            <input id="CostPrice" type="number" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <!-- 規格 -->
                                    <h5 class="mb-3">
                                        🧾 規格資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                規格
                                            </label>
                                            <input id="Specification" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                原產地
                                            </label>
                                            <input id="OriginCountry" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                保存天數
                                            </label>
                                            <input id="ExpireDays" type="number" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <!-- 啟用 -->
                                    <div class="mb-3">
                                        <label class="form-label">
                                            狀態
                                        </label>
                                        <select id="IsActive" class="form-select">
                                            <option value="true">
                                                啟用
                                            </option>
                                            <option value="false">
                                                停用
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">
                                            原料說明
                                        </label>
                                        <textarea id="Description" rows="3" class="form-control"></textarea>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">
                                            備註
                                        </label>
                                        <textarea id="Remark" rows="4" class="form-control"></textarea>
                                    </div>
                                    <hr>
                                    <div class="d-flex gap-2">
                                        <button type="button" id="btnCreate" class="btn btn-success">
                                            ➕ 新增
                                        </button>
                                        <button type="button" id="btnUpdate" class="btn btn-primary">
                                            💾 修改
                                        </button>
                                        <button type="button" id="btnDelete" class="btn btn-danger">
                                            🗑 刪除
                                        </button>
                                        <button type="button" id="btnClear" class="btn btn-secondary">
                                            🔄 清空
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>
    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>
    <script src="../../js/pages/Material/Material.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Material");
        });
    </script>
</body>

</html>
