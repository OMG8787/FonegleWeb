<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜產品管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .product-list-wrapper {
            max-height: calc(100vh - 320px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }

        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            cursor: pointer;
            transition: .2s;
        }

        .product-card:hover {
            box-shadow:
                0 4px 12px rgba(0, 0, 0, .08);
            transform:
                translateY(-2px);
        }

        .product-card.active {
            border:
                2px solid #0d6efd;
            background:
                #eef6ff;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-info {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .empty-area {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .stock-danger {
            color: #dc3545;
            font-weight: bold;
        }

        .stock-normal {
            color: #198754;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        #stockWarning {
            font-weight: bold;
        }

        #profitValue {
            font-weight: bold;
        }

        #profitRate {
            font-weight: bold;
        }

        .badge {
            padding:
                6px 10px;
        }
    </style>
</head>

<body>
    <!-- 頁首 -->
    <div id="headerArea"></div>
    <!-- 主架構 -->
    <div id="erp-layout">
        <!-- 導覽列 -->
        <div id="sidebarArea"></div>
        <!-- 主內容 -->
        <div id="erp-main">
            <div class="container-fluid">
                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">產品管理</h2>
                        <p class="text-muted mb-0">
                            登記產品品項等資訊
                        </p>
                    </div>
                </div>
                <!-- 內容在這 -->
                <div class="row">
                    <!-- 左側 -->
                    <div class="col-lg-4">
                        <div class="card section-card shadow-sm mb-3">
                            <div class="section-header d-flex justify-content-between align-items-center">
                                <span>🔍 產品查詢</span>
                                <button id="btnCreateTop" class="btn btn-success btn-sm">
                                    ➕ 新增產品
                                </button>
                            </div>
                            <div class="section-body">
                                <div class="search-area">
                                    <input id="qSKU" class="form-control mb-2" placeholder="SKU">
                                    <input id="qBarcode" class="form-control mb-2" placeholder="Barcode">
                                    <input id="qProductName" class="form-control mb-2" placeholder="產品名稱">
                                    <input id="qBrand" class="form-control mb-2" placeholder="品牌">
                                    <select id="qCategory" class="form-select mb-2">
                                        <option value="">全部分類</option>
                                    </select>
                                    <input id="qStatus" class="form-control mb-3" placeholder="產品狀態">
                                    <button id="btnSearch" class="btn btn-primary w-100">
                                        查詢產品
                                    </button>
                                    <small class="text-muted">
                                        不輸入任何條件即查詢全部產品
                                    </small>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span id="searchTitle" class="fw-bold">
                                    </span>
                                    <span id="searchCount" class="badge bg-primary">
                                    </span>
                                </div>
                                <div class="product-list-wrapper">
                                    <div id="productList">
                                    </div>
                                </div>
                                <div id="emptyHint" class="empty-area d-none">
                                    查無產品
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 右側 -->
                    <div class="col-lg-8">
                        <div id="formCard" class="card section-card shadow-sm d-none">
                            <div class="section-header d-flex justify-content-between">
                                <span>
                                    📦 產品資料
                                </span>
                                <span id="editHint" class="badge bg-warning text-dark d-none">
                                    編輯模式
                                </span>
                            </div>
                            <div class="section-body">
                                <form id="productForm">
                                    <input type="hidden" id="ID">
                                    <!-- 基本資料 -->
                                    <h5 class="mb-3">
                                        基本資料
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                SKU
                                            </label>
                                            <input id="SKU" class="form-control" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                Barcode
                                            </label>
                                            <input id="Barcode" class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                產品名稱
                                            </label>
                                            <input id="ProductName" class="form-control" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                簡稱
                                            </label>
                                            <input id="ShortName" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        商品資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                分類
                                            </label>
                                            <select id="CategoryID" class="form-select">
                                                <option value="">請選擇分類</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                品牌
                                            </label>
                                            <input id="Brand" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                規格
                                            </label>
                                            <input id="Specification" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                口味
                                            </label>
                                            <input id="Flavor" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                容量
                                            </label>
                                            <input id="Capacity" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                單位
                                            </label>
                                            <input id="Unit" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                重量
                                            </label>
                                            <input id="Weight" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                顏色
                                            </label>
                                            <input id="Color" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                材質
                                            </label>
                                            <input id="Material" class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        價格資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <label class="form-label">
                                                售價
                                            </label>
                                            <input id="SalePrice" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">
                                                會員價
                                            </label>
                                            <input id="MemberPrice" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">
                                                成本
                                            </label>
                                            <input id="CostPrice" type="number" class="form-control">
                                        </div>
                                    </div>
                                    <div class="alert alert-info mt-3 mb-3">
                                        毛利：
                                        <span id="profitValue">0</span>
                                        元
                                        （
                                        <span id="profitRate">0%</span>
                                        ）
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        📦 庫存資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                安全庫存
                                            </label>
                                            <input id="MinStock" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                目前庫存
                                            </label>
                                            <input id="CurrentStock" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">
                                                保存期限(天)
                                            </label>
                                            <input id="ShelfLifeDays" type="number" class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                配方
                                            </label>
                                            <div class="input-group">
                                                <input id="FormulaID" class="form-control" readonly>
                                                <button id="btnFormula" class="btn btn-outline-primary" type="button">
                                                    查詢配方
                                                </button>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                狀態
                                            </label>
                                            <input id="Status" class="form-control" placeholder="例如：販售中、停售、預購中">
                                        </div>
                                    </div>
                                    <div id="stockWarning" class="alert alert-danger d-none">
                                        ⚠ 已低於安全庫存
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        ⚙ 其他設定
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-check form-switch">
                                                <input id="IsB2B" type="checkbox" class="form-check-input">
                                                <label class="form-check-label">
                                                    B2B商品
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-check form-switch">
                                                <input id="IsB2C" type="checkbox" class="form-check-input">
                                                <label class="form-check-label">
                                                    B2C商品
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-check form-switch">
                                                <input id="IsActive" type="checkbox" class="form-check-input">
                                                <label class="form-check-label">
                                                    啟用
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <label class="form-label">
                                            產品說明
                                        </label>
                                        <textarea id="Description" rows="3" class="form-control"></textarea>
                                    </div>
                                    <div class="mt-3">
                                        <label class="form-label">
                                            備註
                                        </label>
                                        <textarea id="Remark" rows="4" class="form-control"></textarea>
                                    </div>
                                    <hr>
                                    <h5 class="mb-3">
                                        📅 系統資訊
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                建立人
                                            </label>
                                            <input id="CreatedBy" readonly class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                建立時間
                                            </label>
                                            <input id="CreatedAt" readonly class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                最後修改人
                                            </label>
                                            <input id="UpdatedBy" readonly class="form-control">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                修改時間
                                            </label>
                                            <input id="UpdatedAt" readonly class="form-control">
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="d-flex gap-2">
                                        <button type="button" id="btnCreate" class="btn btn-success">
                                            ➕ 新增
                                        </button>
                                        <button type="button" id="btnUpdate" class="btn btn-primary">
                                            💾 修改
                                        </button>
                                        <button type="button" id="btnDelete" class="btn btn-danger">
                                            🗑 刪除
                                        </button>
                                        <button type="button" id="btnClear" class="btn btn-secondary">
                                            🔄 清空
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>
    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>
    <script src="../../js/pages/Product/Product.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Product");
        });
    </script>
</body>

</html>
