<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜登入紀錄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .sum-card .num {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .table td,
        .table th {
            white-space: nowrap;
            vertical-align: middle;
        }

        .device {
            white-space: normal !important;
            min-width: 200px;
        }
    </style>
</head>

<body>

    <div id="headerArea"></div>

    <div id="erp-layout">

        <div id="sidebarArea"></div>

        <div id="erp-main">

            <div class="container-fluid">

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">🕒 登入紀錄</h2>
                        <p class="text-muted mb-0">查看誰在什麼時間、用哪個裝置登入，以及使用了多久。登入有效 6 小時，期間內除非登出或被移除，否則不會被登出。</p>
                    </div>
                </div>

                <!-- 目前在線 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">🟢 目前登入中 <span id="onlineCount" class="badge bg-success">0</span></h5>
                            <button id="btnRefresh" class="btn btn-sm btn-outline-secondary">重新整理</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>姓名</th>
                                        <th>裝置</th>
                                        <th>登入時間</th>
                                        <th>最後活動</th>
                                        <th>到期時間</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="onlineBody"></tbody>
                            </table>
                        </div>
                        <div class="small text-muted mt-2">「最後活動」約每 5 分鐘更新一次。也可以直接到試算表「Sessions」分頁刪除該列，效果相同。</div>
                    </div>
                </div>

                <!-- 查詢條件 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="row g-2 align-items-end">
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1">起日</label>
                                <input id="qFrom" type="date" class="form-control">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1">迄日</label>
                                <input id="qTo" type="date" class="form-control">
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label small mb-1">帳號 / 姓名 / 裝置</label>
                                <input id="qKeyword" class="form-control" placeholder="搜尋">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1">結果</label>
                                <select id="qResult" class="form-select">
                                    <option value="">全部</option>
                                    <option value="success">成功</option>
                                    <option value="fail">失敗</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3 d-flex gap-2">
                                <button id="btnSearch" class="btn btn-primary flex-fill">查詢</button>
                                <button id="btnThisMonth" class="btn btn-outline-secondary">本月</button>
                                <button id="btnToday" class="btn btn-outline-secondary">今天</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 各帳號使用時間 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="mb-2">👤 各帳號使用時間（查詢區間）</h5>
                        <div class="table-responsive">
                            <table class="table table-sm mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>姓名</th>
                                        <th>帳號</th>
                                        <th class="text-end">登入次數</th>
                                        <th class="text-end">失敗次數</th>
                                        <th class="text-end">使用時間</th>
                                        <th>最近登入</th>
                                        <th>最近裝置</th>
                                    </tr>
                                </thead>
                                <tbody id="userBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 登入歷程 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-2">📜 登入歷程 <span id="logCount" class="text-muted small"></span></h5>
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>登入時間</th>
                                        <th>姓名</th>
                                        <th>帳號</th>
                                        <th>結果</th>
                                        <th>裝置</th>
                                        <th>最後活動</th>
                                        <th>結束時間</th>
                                        <th>結束原因</th>
                                        <th class="text-end">使用時間</th>
                                    </tr>
                                </thead>
                                <tbody id="logBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footerArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/login-log.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("LoginLog");
        });
    </script>

</body>

</html>
