<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜客戶資料管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
        }

        .section-body {
            padding: 20px;
        }

        .required {
            color: #dc3545;
            font-weight: bold;
        }

        .business-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            transition: .2s;
        }

        .business-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
        }

        .member-info {
            color: #6b7280;
            font-size: 14px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .btn-action {
            min-width: 100px;
        }

        .empty-area {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .edit-mode-tag {
            display: inline-flex;
            align-items: center;

            padding: 10px 18px;

            border-radius: 10px;

            background: #fff8e1;
            border: 1px solid #ffc107;

            color: #b26a00;

            font-weight: 600;

            white-space: nowrap;

            flex-shrink: 0;
        }

        .business-list-wrapper {

            max-height: calc(100vh - 320px);

            overflow-y: auto;

            overflow-x: hidden;

            padding-right: 6px;
        }

        .business-card.active {

            border: 2px solid #0d6efd;

            background: #eef6ff;

        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">客戶資料管理</h2>
                        <p class="text-muted mb-0">
                            B2B客戶資料列表
                        </p>
                        <br>
                        <div class="d-flex gap-2 mb-3">
                            <button id="btnCreateTop" class="btn btn-success">
                                ➕ 新增公司
                            </button>

                            <span id="editHint" class="edit-mode-tag d-none">
                                ✏️ 編輯模式中
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="row">

                    <!-- 左側：搜尋 + 清單 -->
                    <div class="col-lg-4">

                        <!-- 搜尋區 -->
                        <div class="card section-card shadow-sm mb-3">
                            <div class="section-header">
                                🔍 搜尋公司
                            </div>

                            <div class="section-body">

                                <div class="search-area">

                                    <input id="qCompanyName" class="form-control mb-2" placeholder="公司名稱">

                                    <input id="qCompanyID" class="form-control mb-2" placeholder="統編">

                                    <input id="qCompanyAddress" class="form-control mb-2" placeholder="公司地址">

                                    <button id="btnSearch" class="btn btn-primary w-100">
                                        搜尋
                                    </button>
                                    <p>⭐無條件搜尋取全部清單</p>

                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-2">

                                    <span id="searchTitle" class="fw-bold"></span>

                                    <span id="searchCount" class="badge bg-primary"></span>

                                </div>


                                <div class="business-list-wrapper">

                                    <div id="businessList">
                                        <!-- 動態會員卡片 -->
                                        <!-- <div class="member-card">
                                        <div class="member-name">王小明</div>
                                        <div class="member-info">0912-345-678</div>
                                        <div class="member-info">會員 / 啟用</div>

                                        <div class="mt-2 d-flex gap-2">
                                            <button class="btn btn-sm btn-outline-primary btn-action">
                                                編輯
                                            </button>
                                        </div>
                                    </div> -->
                                    </div>

                                </div>
                                <div class="empty-area d-none" id="emptyHint">
                                    查無資料
                                </div>

                            </div>
                        </div>

                    </div>

                    <!-- 右側：編輯表單 -->
                    <div class="col-lg-8">

                        <div class="card section-card shadow-sm d-none">

                            <div class="section-header">
                                📝 公司資料編輯
                            </div>

                            <div class="section-body">

                                <form id="businessForm">

                                    <!-- 目標公司 -->
                                    <div class="row" id="targetCompanyArea">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                目標公司名稱(完整) <span class="required">*</span>
                                            </label>
                                            <input id="TargetCompanyName" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                目標公司編號(完整) <span class="required">*</span>
                                            </label>
                                            <input id="TargetCompanyID" class="form-control">
                                        </div>
                                        <br>
                                        <hr>
                                    </div>


                                    <!-- 公司資料 -->
                                    <h6 class="mb-3">🏢 公司資料</h6>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">公司名稱</label>
                                            <input id="CompanyNameEdit" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">統編</label>
                                            <input id="CompanyIDEdit" class="form-control">
                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">公司電話</label>
                                            <input id="CompanyPhone" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">公司官網</label>
                                            <input id="CompanyURL" class="form-control">
                                        </div>

                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">公司地址</label>
                                        <input id="CompanyAddress" class="form-control">
                                    </div>

                                    <hr>

                                    <!-- 聯絡窗口 -->
                                    <h6 class="mb-3">📞 聯絡窗口</h6>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">聯絡人</label>
                                            <input id="ContactName" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">聯絡電話</label>
                                            <input id="ContactPhone" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">聯絡信箱</label>
                                            <input id="ContactEmail" type="email" class="form-control">
                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 客戶狀態 -->
                                    <h6 class="mb-3">📊 客戶狀態</h6>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">付款狀態分數</label>
                                            <select id="PaymentStstus" class="form-control">
                                                <option value="">請選擇</option>
                                                <option value="0">0 - 未評分</option>
                                                <option value="1">1 - 極差</option>
                                                <option value="2">2 - 偏差</option>
                                                <option value="3">3 - 普通</option>
                                                <option value="4">4 - 良好</option>
                                                <option value="5">5 - 優良</option>
                                            </select>
                                        </div>

                                        <div class="col-md-4">

                                            <div class="form-check form-switch">
                                                <input id="IsMember" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">
                                                    是否加入合作
                                                </label>
                                            </div>

                                            <div class="form-check form-switch">
                                                <input id="IsConverted" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">
                                                    是否成交過
                                                </label>
                                            </div>

                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">窗口業務</label>
                                            <input id="AccountManager" class="form-control">
                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 客戶追蹤 -->
                                    <h6 class="mb-3">📈 客戶追蹤</h6>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">拜訪次數</label>
                                            <input id="TotalVisit" type="number" class="form-control" min="0" max="100">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">郵寄次數</label>
                                            <input id="TotalMail" type="number" class="form-control" min="0" max="100">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">資料來源</label>
                                            <input id="Source" class="form-control">
                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 備註 -->
                                    <h6 class="mb-3">📝 備註資訊</h6>

                                    <div class="mb-3">
                                        <textarea id="Note" class="form-control" rows="6"
                                            placeholder="客戶備註、拜訪紀錄、特殊需求..."></textarea>
                                    </div>

                                    <!-- 操作 -->
                                    <div class="d-flex gap-2">

                                        <button type="button" id="btnCreate" class="btn btn-success">
                                            ➕ 新增
                                        </button>

                                        <button type="button" id="btnUpdate" class="btn btn-primary">
                                            💾 修改
                                        </button>

                                        <button type="button" id="btnClear" class="btn btn-secondary">
                                            🔄 清空
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>

    <script src="../js/pages/company.js"></script>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Business");
        });
    </script>

</body>

</html>
