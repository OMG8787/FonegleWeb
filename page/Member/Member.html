<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜員工及會員管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
        }

        .section-body {
            padding: 20px;
        }

        .required {
            color: #dc3545;
            font-weight: bold;
        }

        .member-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            transition: .2s;
        }

        .member-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
        }

        .member-info {
            color: #6b7280;
            font-size: 14px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .btn-action {
            min-width: 100px;
        }

        .empty-area {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .edit-mode-tag {
            display: inline-flex;
            align-items: center;

            padding: 10px 18px;

            border-radius: 10px;

            background: #fff8e1;
            border: 1px solid #ffc107;

            color: #b26a00;

            font-weight: 600;

            white-space: nowrap;

            flex-shrink: 0;
        }

        .member-list-wrapper {

            max-height: calc(100vh - 320px);

            overflow-y: auto;

            overflow-x: hidden;

            padding-right: 6px;

        }

        .member-card.active {

            border: 2px solid #0d6efd;

            background: #eef6ff;

        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="mb-1">👥 員工及會員管理</h2>
                        <p class="text-muted mb-0">
                            建立會員、查詢會員、修改會員資料
                        </p>
                        <br>
                        <div class="d-flex gap-2 mb-3">
                            <button id="btnCreateTop" class="btn btn-success">
                                ➕ 新增會員
                            </button>

                            <span id="editHint" class="edit-mode-tag d-none">
                                ✏️ 編輯模式中
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 內容在這 -->

                <div class="row">

                    <!-- 左側：搜尋 + 清單 -->
                    <div class="col-lg-4">

                        <!-- 搜尋區 -->
                        <div class="card section-card shadow-sm mb-3">
                            <div class="section-header">
                                🔍 搜尋會員
                            </div>

                            <div class="section-body">

                                <div class="search-area">

                                    <input id="qIdCard" class="form-control mb-2" placeholder="身分證">

                                    <input id="qName" class="form-control mb-2" placeholder="姓名">

                                    <input id="qPhone" class="form-control mb-2" placeholder="電話">

                                    <input id="qLineId" class="form-control mb-2" placeholder="使用者ID">

                                    <button id="btnSearch" class="btn btn-primary w-100">
                                        搜尋
                                    </button>
                                    <p>⭐無條件搜尋取全部清單</p>

                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-2">

                                    <span id="searchTitle" class="fw-bold"></span>

                                    <span id="searchCount" class="badge bg-primary"></span>

                                </div>

                                <div class="member-list-wrapper">
                                    <div id="memberList">

                                        <!-- 動態會員卡片 -->
                                        <!-- <div class="member-card">
                                        <div class="member-name">王小明</div>
                                        <div class="member-info">0912-345-678</div>
                                        <div class="member-info">會員 / 啟用</div>

                                        <div class="mt-2 d-flex gap-2">
                                            <button class="btn btn-sm btn-outline-primary btn-action">
                                                編輯
                                            </button>
                                        </div>
                                    </div> -->

                                    </div>
                                </div>

                                <div class="empty-area d-none" id="emptyHint">
                                    查無資料
                                </div>

                            </div>
                        </div>

                    </div>

                    <!-- 右側：編輯表單 -->
                    <div class="col-lg-8">

                        <div class="card section-card shadow-sm d-none">

                            <div class="section-header">
                                📝 會員資料編輯
                            </div>

                            <div class="section-body">

                                <form id="memberForm">

                                    <!-- 使用者ID（系統自動產生） -->
                                    <div class="mb-3">
                                        <label class="form-label">
                                            使用者ID（新增時自動產生）
                                        </label>
                                        <input id="LineUserId" class="form-control" readonly>
                                    </div>

                                    <!-- 基本資料 -->
                                    <div class="row">

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">姓名</label>
                                            <input id="Name" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">電話</label>
                                            <input id="PhoneNumber" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">身分證</label>
                                            <input id="IdCardNumber" class="form-control">
                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">密碼</label>
                                            <input id="PassWord" type="password" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">信箱</label>
                                            <input id="Email" type="email" class="form-control">
                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">生日</label>
                                            <input id="Birthday" type="date" class="form-control">
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">角色</label>
                                            <select id="RoleId" class="form-control"></select>
                                            <option value="">請選擇角色</option>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">負責專員</label>
                                            <input id="AccountManager" class="form-control">
                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 狀態區 -->
                                    <h6 class="mb-3">⚙️ 狀態設定</h6>

                                    <div class="row">

                                        <div class="col-md-4">

                                            <div class="form-check form-switch">
                                                <input id="IsPushMessage" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">接受推播</label>
                                            </div>

                                            <div class="form-check form-switch">
                                                <input id="IsMember" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">會員</label>
                                            </div>

                                            <div class="form-check form-switch">
                                                <input id="IsBlocked" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">黑名單</label>
                                            </div>

                                            <div class="form-check form-switch">
                                                <input id="IsActive" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">啟用</label>
                                            </div>

                                        </div>

                                        <div class="col-md-4">

                                            <div class="form-check form-switch">
                                                <input id="IsWeb" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">網站</label>
                                            </div>

                                            <div class="form-check form-switch">
                                                <input id="IsMailActive" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">Mail</label>
                                            </div>

                                        </div>

                                        <div class="col-md-4">

                                            <div class="form-check form-switch">
                                                <input id="IsConverted" class="form-check-input" type="checkbox">
                                                <label class="form-check-label">曾交易</label>
                                            </div>

                                        </div>

                                    </div>

                                    <hr>

                                    <!-- 綁定 -->
                                    <h6 class="mb-3">🔗 綁定資訊</h6>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">OpenClaw代理ID</label>
                                            <input id="OpenClaw" class="form-control">
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">龍蝦代理資料庫</label>
                                            <input id="OpenClawAgent" class="form-control">
                                        </div>

                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">角色權限清單</label>
                                        <textarea id="RoleList" class="form-control" rows="3"></textarea>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">我的最愛功能清單</label>
                                        <textarea id="FavoriteFeaturesList" class="form-control" rows="3"></textarea>
                                    </div>

                                    <!-- 操作 -->
                                    <div class="d-flex gap-2">

                                        <button type="button" id="btnCreate" class="btn btn-success">
                                            ➕ 新增
                                        </button>

                                        <button type="button" id="btnUpdate" class="btn btn-primary">
                                            💾 修改
                                        </button>

                                        <button type="button" id="btnClear" class="btn btn-secondary">
                                            🔄 清空
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>


    <script src="../../js/pages/Member/Member.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Member");
        });
    </script>

</body>

</html>
