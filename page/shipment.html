<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜庫存管理(未開放)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .shipping-list-wrapper {
            max-height: calc(100vh - 360px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }

        .shipping-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            cursor: pointer;
            transition: .2s;
        }

        .shipping-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            transform: translateY(-2px);
        }

        .shipping-card.active {
            border: 2px solid #0d6efd;
            background: #eef6ff;
        }

        .shipping-card .fw-bold {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .shipping-card .text-muted {
            font-size: 14px;
            margin-top: 4px;
        }

        .empty-area {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-action {
            min-width: 100px;
        }

        #shippingForm input,
        #shippingForm select,
        #shippingForm textarea {
            border-radius: 8px;
        }

        .badge {
            font-size: 13px;
            padding: 6px 10px;
        }

        /* 出貨狀態 */
        .status-wait {
            background: #ffc107;
            color: #000;
        }

        .status-shipping {
            background: #0d6efd;
            color: white;
        }

        .status-complete {
            background: #198754;
            color: white;
        }

        .status-return {
            background: #dc3545;
            color: white;
        }

        /* 右側表單區 */
        #formCard {
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RWD */
        @media(max-width:992px) {
            .shipping-list-wrapper {
                max-height: none;
            }
        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">出貨管理(未開放)</h2>
                        <p class="text-muted mb-0">
                            盤點/出貨
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="row">


                    <!-- 左側：出貨查詢與列表 -->
                    <div class="col-lg-4">


                        <div class="card section-card shadow-sm mb-3">


                            <div class="section-header">

                                🚚 出貨紀錄查詢

                            </div>



                            <div class="section-body">


                                <div class="search-area">


                                    <!-- 出貨單號 -->

                                    <input id="qShipmentNo" class="form-control mb-2" placeholder="📦 出貨單號">



                                    <!-- 訂單編號 -->

                                    <input id="qOrderNo" class="form-control mb-2" placeholder="🧾 訂單編號">





                                    <!-- 收件人 -->

                                    <input id="qReceiverName" class="form-control mb-2" placeholder="👤 收件人">





                                    <!-- 物流公司 -->

                                    <input id="qLogisticsCompany" class="form-control mb-2" placeholder="🚚 物流公司">





                                    <!-- 物流單號 -->

                                    <input id="qTrackingNumber" class="form-control mb-2" placeholder="🔎 物流追蹤碼">





                                    <!-- 出貨日期 -->


                                    <label class="form-label">

                                        📅 出貨日期

                                    </label>


                                    <input id="qShippingDate" type="date" class="form-control mb-3">






                                    <!-- 狀態 -->

                                    <select id="qShippingStatus" class="form-select mb-3">


                                        <option value="">

                                            全部配送狀態

                                        </option>


                                        <option>

                                            待出貨

                                        </option>


                                        <option>

                                            出貨中

                                        </option>


                                        <option>

                                            已送達

                                        </option>


                                        <option>

                                            退貨

                                        </option>



                                    </select>





                                    <button id="btnSearch" class="btn btn-primary w-100">


                                        🔍 查詢出貨


                                    </button>



                                </div>







                                <div class="d-flex justify-content-between align-items-center mb-2">


                                    <span id="searchTitle" class="fw-bold">


                                    </span>



                                    <span id="searchCount" class="badge bg-primary">


                                    </span>



                                </div>







                                <div class="shipping-list-wrapper">


                                    <div id="shippingList">


                                    </div>


                                </div>







                                <div id="emptyHint" class="empty-area d-none">


                                    查無出貨資料


                                </div>



                            </div>



                        </div>



                    </div>








                    <!-- 右側：出貨資料 -->

                    <div class="col-lg-8">



                        <div id="formCard" class="card section-card shadow-sm d-none">





                            <div class="section-header d-flex justify-content-between">


                                <span>

                                    🚚 出貨資料

                                </span>




                                <span id="editHint" class="badge bg-warning text-dark d-none">

                                    編輯模式

                                </span>



                            </div>







                            <div class="section-body">



                                <form id="shippingForm">



                                    <input id="ShipmentID" type="hidden">






                                    <!-- 出貨基本資料 -->


                                    <h5 class="mb-3">

                                        📋 出貨基本資料

                                    </h5>






                                    <div class="row">


                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                出貨單號

                                            </label>


                                            <input id="ShipmentNo" class="form-control">


                                        </div>





                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                訂單編號

                                            </label>


                                            <input id="OrderID" class="form-control">


                                        </div>






                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                產品ID

                                            </label>


                                            <input id="ProductID" class="form-control">


                                        </div>



                                    </div>







                                    <hr>








                                    <!-- 商品資訊 -->


                                    <h5 class="mb-3">

                                        📦 商品出貨資訊

                                    </h5>





                                    <div class="row">


                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                批號

                                            </label>


                                            <input id="BatchNo" class="form-control">


                                        </div>





                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                出貨數量

                                            </label>


                                            <input id="ShippingQty" type="number" class="form-control">


                                        </div>





                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                單位

                                            </label>


                                            <input id="Unit" class="form-control">


                                        </div>



                                    </div>








                                    <hr>








                                    <!-- 物流資訊 -->


                                    <h5 class="mb-3">

                                        🚚 物流資訊

                                    </h5>





                                    <div class="row">


                                        <div class="col-md-6 mb-3">


                                            <label class="form-label">

                                                物流公司

                                            </label>


                                            <input id="LogisticsCompany" class="form-control">


                                        </div>






                                        <div class="col-md-6 mb-3">


                                            <label class="form-label">

                                                物流追蹤碼

                                            </label>


                                            <input id="TrackingNumber" class="form-control">


                                        </div>



                                    </div>








                                    <hr>








                                    <!-- 收件資訊 -->


                                    <h5 class="mb-3">

                                        👤 收件資訊

                                    </h5>





                                    <div class="row">


                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                收件人

                                            </label>


                                            <input id="ReceiverName" class="form-control">


                                        </div>






                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                電話

                                            </label>


                                            <input id="ReceiverPhone" class="form-control">


                                        </div>






                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                出貨狀態

                                            </label>



                                            <select id="ShippingStatus" class="form-select">


                                                <option>

                                                    待出貨

                                                </option>


                                                <option>

                                                    出貨中

                                                </option>


                                                <option>

                                                    已送達

                                                </option>


                                                <option>

                                                    退貨

                                                </option>



                                            </select>



                                        </div>



                                    </div>








                                    <div class="mb-3">


                                        <label class="form-label">

                                            收件地址

                                        </label>


                                        <input id="ReceiverAddress" class="form-control">


                                    </div>








                                    <hr>







                                    <!-- 時間 -->


                                    <h5 class="mb-3">

                                        ⏰ 出貨時間

                                    </h5>





                                    <div class="row">


                                        <div class="col-md-6 mb-3">


                                            <label class="form-label">

                                                出貨日期

                                            </label>


                                            <input id="ShippingDate" type="datetime-local" class="form-control">


                                        </div>






                                        <div class="col-md-6 mb-3">


                                            <label class="form-label">

                                                收貨日期

                                            </label>


                                            <input id="ReceivedDate" type="datetime-local" class="form-control">


                                        </div>



                                    </div>








                                    <hr>







                                    <!-- 備註 -->


                                    <h5 class="mb-3">

                                        📝 備註

                                    </h5>





                                    <textarea id="Note" class="form-control" rows="5"></textarea>







                                    <hr>







                                    <div class="d-flex gap-2">


                                        <button type="button" id="btnCreate" class="btn btn-success">


                                            ➕ 新增出貨


                                        </button>






                                        <button type="button" id="btnUpdate" class="btn btn-primary">


                                            💾 修改


                                        </button>






                                        <button type="button" id="btnDelete" class="btn btn-danger">


                                            🗑 刪除


                                        </button>






                                        <button type="button" id="btnClear" class="btn btn-secondary">


                                            🔄 清空


                                        </button>




                                    </div>





                                </form>




                            </div>



                        </div>




                    </div>




                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/shipment.js"></script>



    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Shipment");
        });
    </script>

</body>

</html>
