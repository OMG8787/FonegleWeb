<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜產品配方(未開放)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../../css/layout.css" rel="stylesheet">

    <style>
        /* ======================================
   Formula 配方管理
====================================== */


        /* 配方列表 */

        .formula-list-wrapper {

            max-height: calc(100vh - 350px);

            overflow-y: auto;

        }





        .formula-card {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 12px;

            margin-bottom: 10px;

            cursor: pointer;

            background: #fff;

            transition: all .2s ease;

        }





        .formula-card:hover {

            background: #f8f9fa;

            transform: translateY(-2px);

            box-shadow: 0 3px 8px rgba(0, 0, 0, .1);

        }





        .formula-card.active {

            border-color: #0d6efd;

            background: #eef5ff;

        }







        .formula-title {

            font-weight: bold;

            font-size: 16px;

            color: #333;

        }





        .formula-info {

            font-size: 13px;

            color: #777;

            margin-top: 5px;

        }







        /* ======================================
   配方明細表
====================================== */


        #formulaDetailList input {

            min-width: 100px;

        }



        #formulaDetailList td {

            vertical-align: middle;

        }





        #formulaDetailList .material-name {

            font-weight: bold;

        }





        .btn-remove-material {

            width: 32px;

            height: 32px;

            padding: 0;

        }





        /* ======================================
   表單
====================================== */


        #formulaForm label {

            font-weight: 500;

        }





        #formulaForm textarea {

            resize: vertical;

        }





        #formulaForm h5 {

            font-size: 17px;

            border-left: 4px solid #0d6efd;

            padding-left: 10px;

        }







        /* ======================================
   卡片
====================================== */


        .section-card {

            border-radius: 12px;

        }





        .section-header {


            padding: 15px;

            font-size: 18px;

            font-weight: bold;

            border-bottom: 1px solid #eee;

            background: #fafafa;


        }





        .section-body {

            padding: 15px;

        }







        /* ======================================
   明細新增動畫
====================================== */


        .formula-detail-row {


            animation:

                fadeIn .25s ease;


        }



        @keyframes fadeIn {


            from {

                opacity: 0;

                transform: translateY(-5px);

            }


            to {

                opacity: 1;

                transform: translateY(0);

            }


        }







        /* ======================================
   小螢幕
====================================== */


        @media(max-width:992px) {


            .formula-list-wrapper {

                max-height: 300px;

            }


        }

        .search-area {
            padding: 15px;
        }

        .empty-area {

            text-align: center;

            padding: 30px;

            color: #888;

        }
    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">產品配方(未開放)</h2>
                        <p class="text-muted mb-0">
                            紀錄配方細節資料
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <div class="row">


                    <!-- 左側：配方搜尋與列表 -->
                    <div class="col-lg-4">


                        <div class="card section-card shadow-sm mb-3">


                            <div class="section-header">

                                🧪 配方查詢

                            </div>



                            <div class="search-area">


                                <input id="qFormulaName" class="form-control mb-2" placeholder="🧪 配方名稱">


                                <input id="qFormulaCode" class="form-control mb-2" placeholder="📄 配方編號">


                                <input id="qProductID" class="form-control mb-2" placeholder="📦 產品ID">



                                <div class="form-check form-switch mb-3">

                                    <input id="qInactive" class="form-check-input" type="checkbox">


                                    <label class="form-check-label">

                                        顯示停用配方

                                    </label>

                                </div>



                                <button id="btnSearch" class="btn btn-primary w-100">

                                    🔍 查詢配方

                                </button>


                            </div>






                            <div class="section-body">


                                <div class="d-flex justify-content-between align-items-center mb-2">


                                    <span id="searchTitle" class="fw-bold">
                                    </span>



                                    <span id="searchCount" class="badge bg-primary">
                                    </span>


                                </div>





                                <div id="formulaList" class="formula-list-wrapper">


                                </div>




                                <div id="emptyHint" class="empty-area d-none">

                                    查無配方資料

                                </div>



                            </div>



                        </div>


                    </div>









                    <!-- 右側：配方資料 -->
                    <div class="col-lg-8">



                        <div id="formCard" class="card section-card shadow-sm d-none">



                            <div class="section-header d-flex justify-content-between align-items-center">


                                <span>

                                    🧪 配方資料

                                </span>



                                <span id="editHint" class="badge bg-warning text-dark d-none">

                                    編輯模式

                                </span>



                            </div>






                            <div class="section-body">


                                <form id="formulaForm">



                                    <!-- 基本資料 -->

                                    <h5 class="mb-3">

                                        📋 配方基本資料

                                    </h5>




                                    <div class="row">



                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                配方編號

                                            </label>


                                            <input id="FormulaCode" class="form-control">


                                        </div>




                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                產品ID

                                            </label>


                                            <input id="ProductID" class="form-control">


                                        </div>





                                        <div class="col-md-4 mb-3">


                                            <label class="form-label">

                                                版本

                                            </label>


                                            <input id="VersionNo" class="form-control">


                                        </div>





                                        <div class="col-md-8 mb-3">


                                            <label class="form-label">

                                                配方名稱

                                            </label>


                                            <input id="FormulaName" class="form-control">


                                        </div>




                                        <div class="col-md-2 mb-3">


                                            <label class="form-label">

                                                產量

                                            </label>


                                            <input id="YieldQty" type="number" step="0.001" class="form-control">


                                        </div>




                                        <div class="col-md-2 mb-3">


                                            <label class="form-label">

                                                單位

                                            </label>


                                            <input id="YieldUnit" class="form-control">


                                        </div>



                                    </div>





                                    <hr>







                                    <!-- 明細 -->


                                    <h5 class="mb-3">

                                        🥛 原料配方明細

                                    </h5>





                                    <div class="table-responsive">


                                        <table class="table table-bordered">


                                            <thead class="table-light">


                                                <tr>


                                                    <th>
                                                        原料名稱
                                                    </th>


                                                    <th>
                                                        MaterialCode
                                                    </th>


                                                    <th>
                                                        使用量
                                                    </th>


                                                    <th>
                                                        單位
                                                    </th>


                                                    <th>
                                                        備註
                                                    </th>


                                                    <th width="80">
                                                        操作
                                                    </th>


                                                </tr>


                                            </thead>




                                            <tbody id="formulaDetailList">


                                            </tbody>



                                        </table>



                                    </div>






                                    <button type="button" id="btnAddMaterial"
                                        class="btn btn-outline-primary btn-sm mb-3">


                                        ➕ 加入原料


                                    </button>






                                    <hr>








                                    <!-- 狀態 -->


                                    <h5 class="mb-3">

                                        ⚙️ 設定

                                    </h5>




                                    <div class="row">



                                        <div class="col-md-6 mb-3">


                                            <label class="form-label">

                                                啟用狀態

                                            </label>


                                            <select id="IsActive" class="form-select">


                                                <option value="true">
                                                    啟用
                                                </option>


                                                <option value="false">
                                                    停用
                                                </option>


                                            </select>


                                        </div>



                                    </div>






                                    <h5 class="mb-3">

                                        📝 說明

                                    </h5>




                                    <textarea id="Description" class="form-control mb-3" rows="4">
                    </textarea>





                                    <textarea id="Remark" class="form-control" rows="3" placeholder="備註">
                    </textarea>






                                    <hr>






                                    <div class="d-flex gap-2">



                                        <button type="button" id="btnCreate" class="btn btn-success">


                                            ➕ 新增


                                        </button>





                                        <button type="button" id="btnUpdate" class="btn btn-primary">


                                            💾 修改


                                        </button>





                                        <button type="button" id="btnDelete" class="btn btn-danger">


                                            🗑 刪除


                                        </button>





                                        <button type="button" id="btnClear" class="btn btn-secondary">


                                            🔄 清空


                                        </button>



                                    </div>



                                </form>


                            </div>


                        </div>


                    </div>


                </div>

            </div>

        </div>

    </div>
    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../../js/settings.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/core.js"></script>
    <script src="../../js/ai_chat.js"></script>
    <script src="../../js/favorite.js"></script>

    <script src="../../js/pages/Formula/Formula.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Formula");
        });
    </script>

</body>

</html>
