<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜進貨紀錄庫存管理(未開放)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css" rel="stylesheet">

    <style>
        .section-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
            font-weight: 600;
        }

        .section-body {
            padding: 20px;
        }

        .search-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .inventory-list-wrapper {
            height: 500px;
            min-height: 550px;
            max-height: 600px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
        }

        .inventory-qty {
            font-size: 30px;
            font-weight: bold;
            color: #0d6efd;
        }

        .inventory-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: .2s;
        }

        .inventory-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            transform: translateY(-2px);
            border-color: #0d6efd;
        }

        .inventory-card.active {
            border: 2px solid #0d6efd;
            background: #eef6ff;
        }

        .inventory-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .inventory-info {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .empty-area {
            text-align: center;
            color: #94a3b8;
            padding: 60px 20px;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .qty-input {
            width: 120px;
        }

        .card-header {
            background: #fafafa;
            font-weight: 600;
        }

        .inventory-list-wrapper {
            min-height: 420px;
            max-height: 420px;
            overflow-y: auto;
            padding: 10px;
        }

        .inventory-card {
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 12px;
            background: white;
        }

        .inventory-card:hover {
            border-color: #0d6efd;
        }
    </style>
</head>

<body>
    <!-- 頁首 -->
    <div id="headerArea"></div>
    <!-- 主架構 -->
    <div id="erp-layout">
        <!-- 導覽列 -->
        <div id="sidebarArea"></div>
        <!-- 主內容 -->
        <div id="erp-main">
            <div class="container-fluid">
                <!-- 標題 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">
                            進貨紀錄庫存管理
                        </h2>
                        <p class="text-muted mb-0">
                            快速盤點庫存數量、進貨紀錄登入清單
                        </p>
                    </div>
                </div>
                <!-- 內容在這 -->
                <!-- ==================== 第一區：快速盤點 ==================== -->
                <div class="card section-card shadow-sm mb-3">
                    <div class="section-header">
                        ⚡ 快速盤點
                    </div>
                    <div class="section-body">
                        <div class="row">
                            <!-- 盤點模式 -->
                            <div class="col-md-4">
                                <label class="form-label">
                                    盤點模式
                                </label>
                                <select id="ddlInventoryType" class="form-select">
                                    <option value="product">
                                        產品清單
                                    </option>
                                    <option value="material">
                                        原料清單
                                    </option>
                                </select>
                            </div>
                            <!-- 盤點列表 -->
                            <div class="col-md-4">
                                <label class="form-label">
                                    盤點列表
                                </label>
                                <select id="ddlQuickProduct" class="form-select">
                                    <option value="">
                                        請先取得盤點列表
                                    </option>
                                </select>
                            </div>
                            <!-- 盤點數量 -->
                            <div class="col-md-2">
                                <label class="form-label">
                                    盤點數量
                                </label>
                                <input id="QuickQty" type="number" min="0" step="1" class="form-control">
                            </div>
                            <!-- 操作 -->
                            <div class="col-md-2">
                                <label class="form-label invisible">
                                    button
                                </label>
                                <div class="d-grid gap-2">
                                    <button id="btnGetInventoryList" class="btn btn-outline-primary">
                                        📋 取盤點列表
                                    </button>
                                    <button id="btnQuickInventory" class="btn btn-success">
                                        ✅ 立即盤點
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3 text-muted small">
                            快速盤點會更新產品或原料目前庫存，不修改進貨紀錄。
                        </div>
                    </div>
                </div>

                <!-- ==================== 第二區：進貨紀錄搜尋 ==================== -->
                <div class="card section-card shadow-sm mb-3">
                    <div class="section-header">
                        🔍 進貨紀錄查詢
                    </div>
                    <div class="section-body">
                        <div class="row">
                            <!-- 品項 -->
                            <div class="col-md-3">
                                <label class="form-label">
                                    進貨品項
                                </label>
                                <select id="ddlProduct" class="form-select">
                                    <option value="">
                                        全部品項
                                    </option>
                                </select>
                            </div>
                            <!-- 批號 -->
                            <div class="col-md-3">
                                <label class="form-label">
                                    批號
                                </label>
                                <input id="ddlBatchNo" class="form-control" placeholder="輸入批號">
                            </div>
                            <!-- 倉庫 -->
                            <div class="col-md-2">
                                <label class="form-label">
                                    倉庫
                                </label>
                                <input id="ddlWarehouse" class="form-control" placeholder="倉庫">
                            </div>
                            <!-- 日期 -->
                            <div class="col-md-2">
                                <label class="form-label">
                                    進貨日期
                                </label>
                                <input id="ddlReceiveDate" type="date" class="form-control">
                            </div>
                            <!-- 查詢 -->
                            <div class="col-md-2">
                                <label class="form-label invisible">
                                    button
                                </label>
                                <div class="d-grid gap-2">
                                    <button id="btnSearch" class="btn btn-primary">
                                        🔍 查詢
                                    </button>
                                    <button id="btnSearchReset" class="btn btn-outline-secondary">
                                        清除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ==================== 第三區：進貨紀錄列表 ==================== -->
                <div class="card section-card shadow-sm mt-3">
                    <div class="section-header d-flex justify-content-between">
                        <span>
                            📥 進貨紀錄列表
                        </span>
                        <span id="receiveCount" class="badge bg-primary">
                            0
                        </span>
                    </div>
                    <div class="section-body">
                        <div class="text-muted small mb-2">
                            點選一筆進貨紀錄即可查看並修改資料
                        </div>
                        <div class="card border">
                            <div class="card-body inventory-list-wrapper">
                                <div id="receiveList" class="d-flex flex-column gap-2">
                                </div>
                                <div id="receiveEmpty" class="empty-area">
                                    尚無進貨紀錄
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ==================== 第四區：進貨建立 / 修改 ==================== -->
                <div class="card section-card shadow-sm mt-3">
                    <div class="section-header d-flex justify-content-between">


                        <span>
                            ⚙ 進貨資料建立 / 修改
                        </span>


                        <div>


                            <button id="btnNewInventory" class="btn btn-success btn-sm">


                                ➕ 新增進貨


                            </button>


                        </div>


                    </div>
                    <div class="section-body">
                        <form id="inventoryForm">
                            <input id="InventoryID" type="hidden">
                            <h6 class="fw-bold mb-3">
                                基本資料
                            </h6>
                            <div class="row">
                                <!-- 品項 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        產品 / 原料
                                    </label>
                                    <select id="ProductID" class="form-select">
                                    </select>
                                </div>
                                <!-- 批號 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        批號
                                    </label>
                                    <input id="BatchNo" class="form-control">
                                </div>
                                <!-- 倉庫 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        倉庫
                                    </label>
                                    <input id="Warehouse" class="form-control" value="主倉">
                                </div>
                            </div>
                            <div class="row">
                                <!-- 進貨數量 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        進貨數量
                                    </label>
                                    <input id="StockQty" type="number" min="0" class="form-control">
                                </div>
                                <!-- 儲位 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        儲位
                                    </label>
                                    <input id="Location" class="form-control">
                                </div>
                                <!-- 狀態 -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        狀態
                                    </label>
                                    <input id="Status" class="form-control" value="正常">
                                </div>
                            </div>
                            <hr>
                            <h6 class="fw-bold mb-3">
                                日期資訊
                            </h6>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">
                                        製造日期
                                    </label>
                                    <input id="MfgDate" type="date" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">
                                        有效日期
                                    </label>
                                    <input id="ExpDate" type="date" class="form-control">
                                </div>
                            </div>
                            <hr>
                            <h6 class="fw-bold mb-3">
                                系統資訊
                            </h6>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        是否啟用
                                    </label>
                                    <select id="IsActive" class="form-select">
                                        <option value="true">
                                            啟用
                                        </option>
                                        <option value="false">
                                            停用
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        建立時間
                                    </label>
                                    <input id="CreatedAt" readonly class="form-control bg-light">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        修改時間
                                    </label>
                                    <input id="UpdatedAt" readonly class="form-control bg-light">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    備註
                                </label>
                                <textarea id="Remark" rows="4" class="form-control"></textarea>
                            </div>
                            <hr>
                            <div class="d-flex gap-2">
                                <button id="btnCreate" type="button" class="btn btn-success">
                                    📥 建立進貨
                                </button>
                                <button id="btnUpdate" type="button" class="btn btn-primary">
                                    💾 修改進貨紀錄
                                </button>
                                <button id="btnDelete" type="button" class="btn btn-danger">
                                    🗑 刪除進貨紀錄
                                </button>
                                <button id="btnCancel" type="button" class="btn btn-secondary">
                                    取消
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/inventory.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("Inventory");
        });
    </script>

</body>

</html>
