<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>瘋菓內部管理系統｜廠商連結樹資料管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="../css/layout.css" rel="stylesheet">

    <style>

    </style>
</head>

<body>

    <!-- 頁首 -->
    <div id="headerArea"></div>

    <!-- 主架構 -->
    <div id="erp-layout">

        <!-- 導覽列 -->
        <div id="sidebarArea"></div>

        <!-- 主內容 -->
        <div id="erp-main">

            <div class="container-fluid">

                <!-- 標題 -->
                <div id="formCard" class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="mb-1">連結樹資料管理</h2>
                        <p class="text-muted mb-0">
                            加入關注連結樹
                        </p>
                    </div>
                </div>

                <!-- 內容在這 -->
                <!-- 新增連結樹 -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="mb-3">➕ 新增連結樹</h5>
                        <div id="editHint" class="text-warning fw-bold mb-2 d-none">
                            ✏️ 目前為編輯模式
                        </div>
                        <input id="addOwner" class="form-control mb-2" placeholder="連結樹廠商">
                        <input id="addUrl" class="form-control mb-2" placeholder="連結樹網址">

                        <select id="addStatus" class="form-select mb-2">
                            <option value="0">✔ 需要自動爬蟲</option>
                            <option value="1">✘ 無須自動爬蟲</option>
                        </select>

                        <input id="addNote" class="form-control mb-2" placeholder="其他備註">

                        <button id="btnAdd" class="btn btn-primary">
                            建立連結樹
                        </button>
                    </div>
                </div>

                <!-- 查詢 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">🔍 連結樹查詢</h5>

                        <input id="searchKey" class="form-control mb-2" placeholder="輸入關鍵字（廠商 / 網址）">
                        <button id="btnSearch" class="btn btn-dark mb-3">查詢</button>


                        <div class="mb-3">
                            <button id="btnFilterAll" class="btn btn-outline-secondary btn-sm">全部</button>
                            <button id="btnFilterAuto" class="btn btn-outline-secondary btn-sm">自動爬蟲</button>
                            <button id="btnFilterManual" class="btn btn-outline-secondary btn-sm">無須爬蟲</button>
                        </div>
                        <div id="listArea"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- 頁尾 -->
    <div id="footerArea"></div>

    <!-- 共用 layout -->
    <script src="../js/settings.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.checkLogin();
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/ai-chat.js"></script>
    <script src="../js/favorite.js"></script>
    <script src="../js/pages/market-link.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            App.init("LinkTree");
        });
    </script>

</body>

</html>
